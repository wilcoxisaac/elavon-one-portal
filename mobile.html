<style>:root{--elavon:#02025B;--bright:#005DED;--lgray:#EBEFF6;--line:#DCE0EB;--gray7:#63637F;--lblue:#E1F5FF;--mblue:#C0E7FF}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 "U.S. Bank Circular","Circular Std",Arial,Helvetica,sans-serif;color:#111122;background:var(--lgray);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--bright);text-decoration:none}
/* ===== Demo stage ===== */
.dbar{height:60px;background:var(--elavon);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px}
.dbar img{height:32px}.dbar .t{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;border-left:1px solid #ffffff40;padding-left:14px}
.dbar .sp{flex:1}
.dbar a.bo{color:#fff;border:1px solid #ffffff50;border-radius:999px;padding:7px 16px;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap}
.dbar a.bo:hover{background:#ffffff1a}
.dmain{display:grid;grid-template-columns:290px minmax(0,1fr) 310px;height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.dside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}
.dside.r{border-right:0;border-left:1px solid var(--line)}
.dside h4{margin:0 0 8px;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gray7)}
.dside h4:not(:first-child){margin-top:20px}
.dopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:6px;color:var(--elavon)}
.dopt:hover{border-color:var(--elavon)}
.dopt.on{background:var(--lblue);border-color:var(--bright)}
.dopt b{display:block;font-weight:500}.dopt span{font-size:12px;color:var(--gray7)}
.dopt .di{width:34px;height:34px;border-radius:9px;background:var(--lgray);display:grid;place-items:center;flex:none;color:var(--elavon)}
.dopt.on .di{background:var(--bright);color:#fff}
.guide{counter-reset:g;margin:0;padding:0;list-style:none}
.guide li{counter-increment:g;display:flex;gap:10px;padding:6px 0;font-size:13px;color:#33334D}
.guide li:before{content:counter(g);width:20px;height:20px;border-radius:50%;background:var(--elavon);color:#fff;font-size:11px;display:grid;place-items:center;flex:none;margin-top:1px}
.dbtn{border:1px solid #CDD1E2;background:#fff;border-radius:999px;padding:7px 14px;color:var(--elavon);font-weight:500;width:100%;margin-top:12px}
.dbtn:hover{border-color:var(--elavon)}
.dcenter{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff,#EBEFF6 70%)}
.dcap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--gray7)}
#devwrap{position:relative}
.sync{font-size:13px}
.sync .ev{padding:9px 0;border-bottom:1px solid #EEF1F5;animation:evin .35s}
.sync .ev b{color:var(--elavon);font-weight:500;display:block}.sync .ev span{color:var(--gray7);font-size:12px}
.sync .ev a{font-size:12px;font-weight:500}
@keyframes evin{from{background:var(--lblue)}}
.sync .empty{color:var(--gray7);padding:8px 0}
.dtool{display:none}
/* ===== Devices ===== */
.dev{position:relative;transform-origin:top left;background:#15161A;box-shadow:0 30px 60px #02025B30,inset 0 0 0 2px #2c2d33}
.screen{position:relative;width:var(--sw);height:var(--sh);background:#fff;overflow:hidden;container-type:inline-size;container-name:scr;display:flex;flex-direction:column}
.dev-iphone{padding:12px;border-radius:58px}.dev-iphone .screen{border-radius:46px}
.dev-android{padding:10px;border-radius:44px;background:#1d1f24}.dev-android .screen{border-radius:34px}
.dev-mini{padding:26px 14px 50px;border-radius:26px;background:#23252B}.dev-mini .screen{border-radius:6px}
.dev-f4{padding:104px 13px 30px;border-radius:26px;background:#1B1C21}.dev-f4 .screen{border-radius:8px}
.dev-s2{padding:20px 20px 22px;border-radius:18px;background:#1B1C21;margin-bottom:96px}.dev-s2 .screen{border-radius:4px}
.deco{position:absolute;pointer-events:none}
.dev-iphone .island{left:50%;top:23px;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px;z-index:9}
.dev-android .punch{left:50%;top:22px;width:14px;height:14px;margin-left:-7px;background:#000;border-radius:50%;z-index:9}
.dev-mini .lbl,.dev-f4 .lbl,.dev-s2 .lbl{color:#8a8c95;font-size:10px;letter-spacing:2px;left:0;right:0;text-align:center}
.dev-mini .lbl{top:8px}.dev-mini .slot{left:22%;right:22%;bottom:16px;height:6px;border-radius:3px;background:#0b0b0d;box-shadow:inset 0 1px 2px #000}
.dev-mini .nfc{right:16px;bottom:28px;color:#6d6f78}
.dev-f4 .printer{left:13px;right:13px;top:14px;height:74px;border-radius:14px;background:#24262c;box-shadow:inset 0 2px 6px #0008}
.dev-f4 .pslot{left:34px;right:34px;top:24px;height:5px;background:#060607;border-radius:3px}
.dev-f4 .paper{left:40px;right:40px;top:26px;height:0;background:repeating-linear-gradient(#fff,#fff 9px,#e9e9e9 10px);transform-origin:bottom;transition:height 1.6s ease-out, top 1.6s ease-out;border-radius:2px 2px 0 0;z-index:3}
.dev-f4.printing .paper{height:120px;top:-94px}
.dev-f4 .lbl{top:58px}.dev-f4 .msr{right:-3px;top:140px;bottom:120px;width:4px;background:#000;border-radius:2px}
.dev-s2 .lbl{bottom:5px}
.dev-s2 .stand{left:50%;bottom:-70px;width:120px;height:70px;margin-left:-60px;background:linear-gradient(#26272d,#1B1C21)}
.dev-s2 .base{left:50%;bottom:-96px;width:330px;height:28px;margin-left:-165px;background:#1B1C21;border-radius:12px 12px 6px 6px;box-shadow:0 14px 24px #02025B30}
.dev-s2 .rdr{right:-58px;top:30%;width:52px;height:150px;background:#1B1C21;border-radius:0 12px 12px 0;color:#7d7f88;display:grid;place-items:center}
.status{height:var(--stat,44px);flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:700;background:var(--p,#02025B);color:#fff}
.status .ri{display:flex;gap:5px;align-items:center;font-weight:500;font-size:11px}
.dev-iphone .status{--stat:54px;padding-bottom:8px}.dev-android .status{--stat:44px}
.dev-mini .status,.dev-f4 .status,.dev-s2 .status{--stat:24px;padding:0 10px 3px;font-size:11px}
.homebar{position:absolute;left:50%;bottom:7px;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#0006;z-index:30;pointer-events:none}
.dev-mini .homebar,.dev-f4 .homebar,.dev-s2 .homebar{display:none}
/* ===== App ===== */
#app{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "body" "foot" "tabs";background:var(--bg);color:var(--tx);font-size:15px;position:relative}
#app,#payov,#sheet,.status{--p:#02025B;--a:#005DED;--as:#E1F5FF;--bg:#F1F5FB;--tx:#111122;--mut:#63637F;--ln:#DCE0EB;--ok:#2E7F7E;--bad:#CF2A36;--onp:#fff}
[data-theme=summit]{--p:#1E4D3B!important;--a:#C2571A!important;--as:#F4E7DA!important;--bg:#F6F3EC!important;--tx:#1d2a24!important;--mut:#6b7069!important;--ln:#E2DCCF!important}
[data-theme=summit] .ahead h1,[data-theme=summit] .big{font-family:Georgia,"Times New Roman",serif}
.ahead{grid-area:head;background:var(--p);color:#fff;padding:8px 14px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.ahead h1{margin:0;font-size:18px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahead .sub{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahead .tt{flex:1;min-width:0}
.hbtn{background:#ffffff1f;border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.avm{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--p);font-weight:700;font-size:13px;border:0;flex:none}
.cobrand{grid-area:head;display:contents}
.pstrip{background:#C0E7FF;color:#02025B;font-size:12px;padding:5px 14px;display:flex;gap:8px;align-items:center;font-weight:500}
.pstrip button{margin-left:auto;border:0;background:#02025B;color:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px}
.headwrap{grid-area:head;min-width:0}
.abody{grid-area:body;overflow-y:auto;overflow-x:hidden;padding:12px 14px 16px;min-width:0;-webkit-overflow-scrolling:touch}
.afoot{grid-area:foot;padding:10px 14px;background:#fff;border-top:1px solid var(--ln)}
.atabs{grid-area:tabs;display:flex;background:#fff;border-top:1px solid var(--ln);padding:4px 4px calc(6px + var(--safe,0px))}
.atabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:5px 0;position:relative;min-width:0}
.atabs button.on{color:var(--a);font-weight:700}
.atabs .bdg{position:absolute;top:0;left:50%;margin-left:6px;background:var(--a);color:#fff;border-radius:9px;font-size:9.5px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.dev-iphone .atabs,.bare .atabs{--safe:14px}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--a);color:#fff;font-weight:700;padding:13px 18px;width:100%;font-size:15.5px}
.mb.sec{background:#fff;color:var(--p);border:1.5px solid var(--ln);font-weight:500}
.mb.dark{background:var(--p)}.mb.sm{padding:8px 14px;font-size:13.5px;width:auto}.mb.bad{background:#fff;color:var(--bad);border:1.5px solid var(--ln)}
.mb:disabled{opacity:.45}
.brow{display:flex;gap:8px}.brow>*{flex:1}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.lrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #EEF1F5;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-width:0}
.lrow:last-child{border-bottom:0}
.lrow .li{width:38px;height:38px;border-radius:11px;background:var(--as);color:var(--a);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.lrow .lm{flex:1;min-width:0}.lrow .lm b{display:block;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .lm span{font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lr{text-align:right;font-weight:500;white-space:nowrap;font-size:14px}
.pl{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;background:#EBEFF6;color:#02025B;white-space:nowrap}
.pl.ok{background:#E2F2F1;color:#2E7F7E}.pl.warn{background:#FDEAE2;color:#B4461D}.pl.bad{background:#FBE5E7;color:#CF2A36}.pl.a{background:var(--as);color:var(--a)}
.srch{width:100%;border:1px solid var(--ln);border-radius:999px;padding:10px 16px;background:#fff;font-size:16px;margin-bottom:10px}
.srch:focus,.inp:focus{outline:3px solid #005DED33;border-color:var(--a)}
.inp{width:100%;border:1px solid var(--ln);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--tx);font-weight:500}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 11px;text-align:left;min-height:84px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile i{position:absolute;left:0;top:0;bottom:0;width:5px}
.tile b{font-weight:500;font-size:14px;line-height:1.25;color:var(--tx)}.tile span{margin-top:auto;color:var(--mut);font-size:13px}
.tile.out{opacity:.45}.tile .q{position:absolute;right:8px;top:8px;background:var(--a);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11.5px;display:grid;place-items:center;font-weight:700}
.cartbar{display:flex;align-items:center;gap:10px}
.sellwrap{display:block}.cartpane{display:none}
.cl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EEF1F5;align-items:flex-start}
.cl .cm{flex:1;min-width:0}.cl .cm b{font-weight:500;display:block}.cl .cm span{font-size:12.5px;color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:2px;flex:none}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:16px;line-height:1;color:var(--p)}.qty em{font-style:normal;min-width:22px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;color:var(--mut)}.tot.g{color:var(--tx);font-weight:700;font-size:18px;padding-top:8px;border-top:1px solid var(--ln);margin-top:6px}
.tot .neg{color:var(--ok)}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kp div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.kp span{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:block}.kp b{font-size:20px;font-weight:500;color:var(--p)}
.big{font-size:34px;font-weight:400;letter-spacing:-.6px;color:var(--p)}
.mut{color:var(--mut)}.sm{font-size:12.5px}.ctr{text-align:center}
.seg2{display:flex;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:3px;margin-bottom:10px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-weight:500;color:var(--mut);font-size:13.5px}.seg2 button.on{background:var(--p);color:#fff}
.bar{height:8px;border-radius:5px;background:#E7EAF2;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:5px}
.hero2{background:linear-gradient(135deg,#1A92FF,#005DED 40%,#02025B);color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}
[data-theme=summit] .hero2{background:linear-gradient(135deg,#2F6B54,#1E4D3B 60%,#12261D)}
.hero2 .big{color:#fff}.hero2 .mut{color:#ffffffc0}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:10px}
.qa button{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--tx);font-weight:500}
.qa button svg{color:var(--a)}
/* sheet */
#sheet{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;background:#02025B66}
#sheet.on{display:flex}
.sh{background:#fff;width:100%;max-height:86%;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + var(--safe,0px));overflow:auto;animation:shup .22s ease-out;color:var(--tx)}
.sh:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#CDD1E2;margin:0 auto 10px}
.sh h2{margin:0 0 10px;font-size:18px;font-weight:500;color:var(--p)}
@keyframes shup{from{transform:translateY(40px);opacity:0}}
#toastm{position:absolute;left:14px;right:14px;top:8px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tm{background:#02025B;color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:0 8px 20px #0003;animation:shup .2s}
#splash{position:absolute;inset:0;z-index:80;background:var(--p,#02025B);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#splash.on{display:flex;animation:fade .25s}@keyframes fade{from{opacity:0}}
#splash .avx{width:70px;height:70px;border-radius:20px;background:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
/* pay overlay */
#payov{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;background:var(--bg);color:var(--tx);font-size:15px}
#payov.on{display:flex}
.pv{flex:1;min-height:0;display:flex;flex-direction:column}
.pvh{background:var(--p);color:#fff;padding:calc(var(--stat,44px) + 4px) 14px 12px;display:flex;align-items:center;gap:10px}
.pvh b{flex:1;font-weight:500;font-size:16px}
.pvb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.pvb.c{align-items:center;justify-content:center;text-align:center}
.amt{font-size:42px;font-weight:400;letter-spacing:-1px;color:var(--p);line-height:1.1}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.tips button{border:1.5px solid var(--ln);background:#fff;border-radius:14px;padding:14px 4px;font-weight:700;font-size:18px;color:var(--p)}
.tips button span{display:block;font-weight:400;font-size:12.5px;color:var(--mut)}
.meth{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ln);background:#fff;border-radius:14px;padding:13px 14px;width:100%;text-align:left}
.meth .mi{width:42px;height:42px;border-radius:12px;background:var(--as);color:var(--a);display:grid;place-items:center;flex:none}
.meth b{display:block;font-weight:500}.meth span{font-size:12.5px;color:var(--mut)}
.reader{width:150px;height:150px;border-radius:50%;background:var(--as);display:grid;place-items:center;color:var(--a);position:relative;margin:6px auto}
.reader:before,.reader:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);opacity:0;animation:pulse 2s infinite}
.reader:after{animation-delay:1s}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.45);opacity:0}}
.sim{width:100%;border-top:1px dashed var(--ln);padding-top:10px;margin-top:auto}
.sim small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.sim .sg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sim button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 6px;font-size:13px;color:var(--p);font-weight:500}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--as);border-top-color:var(--a);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .3s}.okc.bad{background:var(--bad)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.pinp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:280px}
.pinp button{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:12px 0;font-size:19px;font-weight:500;color:var(--p)}
.dots{display:flex;gap:10px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--p)}.dots i.f{background:var(--p)}
.scanov{position:absolute;inset:0;z-index:55;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.scanov.on{display:flex}
.vf{width:70%;max-width:300px;aspect-ratio:1.5;border:3px solid #fff;border-radius:16px;position:relative;overflow:hidden}
.vf:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:#ff5a3c;top:10%;animation:sweep 1s ease-in-out infinite alternate}
@keyframes sweep{to{top:88%}}
.stk{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13.5px;align-items:center}
/* wide device (S2Pro) */
@container scr (min-width:700px){
 #app{grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"tabs head" "tabs body" "tabs foot";font-size:16px}
 .atabs{flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:10px 4px;justify-content:flex-start;gap:6px}
 .atabs button{flex:none;padding:10px 0;font-size:11.5px}
 .abody{padding:16px 20px}
 .abody>.narrow{max-width:640px;margin:0 auto}
 .sellwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;height:100%}
 .sellwrap>.cat{overflow:auto;min-height:0}
 .cartpane{display:flex;flex-direction:column;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-height:0;overflow:hidden}
 .cartpane>div:nth-child(2){overflow:auto;min-height:0}
 .abody.sellb{overflow:hidden}
 .afoot.cartfoot{display:none}
 .sh{max-width:520px;margin:0 auto;border-radius:20px;margin-bottom:5%}
 #sheet{align-items:center}
 .pv{max-width:520px;width:100%;margin:0 auto;background:var(--bg)}
 #payov{background:#02025Bcc}
 .pvh{padding-top:14px;border-radius:0}
 .pv{margin:24px auto;border-radius:18px;overflow:hidden;flex:1}
 .kp{grid-template-columns:repeat(4,minmax(0,1fr))}
 #toastm{left:auto;right:20px;width:320px;top:40px}
}
@container scr (max-width:340px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ahead h1{font-size:16px}.abody{padding:10px 10px 14px}.afoot{padding:8px 10px}
 .amt{font-size:34px}.reader{width:110px;height:110px}.pvb{padding:12px;gap:8px}
 .atabs button{font-size:9.5px}.tips button{padding:10px 2px;font-size:16px}
 .pinp button{padding:8px 0}
}
/* ===== Responsive stage ===== */
@media (max-width:1180px){.dmain{grid-template-columns:250px minmax(0,1fr)}.dside.r{display:none}}
@media (max-width:820px){
 .dmain{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 .dside.l{display:none}
 .dtool{display:flex;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
 .dtool select{flex:1;border:1px solid #CDD1E2;border-radius:999px;padding:8px 12px;background:#fff;min-width:0;font-size:16px}
 .dbar .t{display:none}
}
/* Real phone: the app fills the screen, no frame */
body.bare{overflow:hidden;background:#02025B}
.bare .dbar,.bare .dside,.bare .dtool,.bare .dcap,.bare .deco{display:none!important}
.bare .dmain{display:block;height:100dvh}
.bare .dcenter{height:100dvh;display:block;background:none}
.bare #devwrap{width:100%!important;height:100%!important}
.bare .dev{transform:none!important;padding:0;border-radius:0;box-shadow:none;width:100%;height:100%;margin:0}
.bare .screen{width:100%;height:100%;border-radius:0}
.bare .status{display:none}.bare .ahead,.bare .pstrip:first-child{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bare .pvh{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.bare .homebar{display:none}
.appwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.pvh{padding:12px 14px!important}
.bare .pvh{padding-top:calc(12px + env(safe-area-inset-top,0px))!important}
a.lrow{color:inherit}
.lrow{font-size:inherit}
.dev{width:max-content}

/* back office inside the phone */
#boview{position:absolute;inset:0;z-index:45;display:none;flex-direction:column;background:#EBEFF6}
#boview.on{display:flex;animation:shup .22s ease-out}
.boh{background:#02025B;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px}
.boh .tt{flex:1;min-width:0;line-height:1.2}.boh .tt b{display:block;font-weight:500;font-size:15px}.boh .tt span{font-size:11.5px;opacity:.8}
.boh a.hbtn{color:#fff}
.bob{flex:1;min-height:0;position:relative;display:grid;place-items:center}

.bob iframe.rdy{opacity:1}
.bare .boh{padding-top:calc(8px + env(safe-area-inset-top,0px))}
/* printed receipt beside the terminal */
#rcpt{position:absolute;z-index:20;display:none;width:236px;cursor:pointer;overflow:auto;filter:drop-shadow(0 14px 22px #02025B33)}
#rcpt.on{display:block;animation:rcin .7s ease-out}
@keyframes rcin{from{clip-path:inset(0 0 100% 0);transform:translateY(-14px)}to{clip-path:inset(0 0 0 0)}}
.rp{background:#fff;color:#1b1b1f;font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:16px 14px 20px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 100%}
.rp .rc-h{text-align:center}.rp .rc-h b{display:block;font-size:14px;letter-spacing:.3px}.rp .rc-h span{display:block}

.rhint{text-align:center;font:500 12px Arial,Helvetica,sans-serif;color:#02025B;background:#fff;border-radius:999px;padding:5px 10px;margin:10px auto 0;width:max-content;border:1px solid #DCE0EB}

/* ---------- Router ---------- */
function tab(t){nav().tab=t;nav().stack=[];draw()}

function draw(){const n=nav(),top=n.stack[n.stack.length-1],app=$('#app');const key=A.seg+'|'+n.tab+'|'+n.stack.map(s=>s.fn+(s.arg||'')).join('/');const sb=$('.abody',app),keep=key===_vk&&sb?sb.scrollTop:0;const sc=$('.sellwrap>.cat',app),keep2=key===_vk&&sc?sc.scrollTop:0;
 [app,$('#sheet'),$('#payov'),$('.status')].forEach(e=>e.dataset.theme=THEME());
 const T=typeof TABS[A.seg]==='function'?TABS[A.seg]():TABS[A.seg];if(!T[n.tab])n.tab=Object.keys(T)[0];app.innerHTML=top?PAGES[top.fn](top.arg):T[n.tab]();_vk=key;
 const nb=$('.abody',app);if(nb&&keep)nb.scrollTop=keep;const nc=$('.sellwrap>.cat',app);if(nc&&keep2)nc.scrollTop=keep2}
function tabbar(){const n=nav();return `<nav class="atabs">${TABDEF[A.seg]().map(t=>`<button class="${n.tab===t.id&&!n.stack.length?'on':''}" onclick="tab('${t.id}')">${ic(t.icon,21)}${t.label}${t.badge?`<span class="bdg">${t.badge}</span>`:''}</button>`).join('')}</nav>`}
function head(title,o={}){const e=EXP[A.seg];return `<div class="headwrap">${o.strip||''}<div class="ahead">${o.back?`<button class="hbtn" onclick="${o.back===true?'pop()':o.back}" aria-label="Back">${ic('back',20)}</button>`:''}${o.logo||''}<div class="tt"><h1>${title}</h1>${o.sub?`<div class="sub">${o.sub}</div>`:''}</div>${o.right||''}${o.back?'':`<button class="avm" onclick="expSheet()" title="Switch experience">${e.ini}</button>`}</div></div>`}
function view(o){return `${o.head}<div class="abody ${o.cls||''}">${o.wide?o.body:`<div class="narrow">${o.body}</div>`}</div>${o.foot?`<div class="afoot ${o.footCls||''}">${o.foot}</div>`:''}${o.tabs===false?'':tabbar()}`}
const lrow=(icon,title,sub,right,onclick)=>`<button class="lrow" ${onclick?`onclick="${onclick}"`:''}><span class="li">${icon}</span><span class="lm"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span>${right!=null?`<span class="lr">${right}</span>`:''}</button>`;
const pl=(t,c='')=>`<span class="pl ${c}">${t}</span>`;
const stPill=s=>pl(s,/Approved|Ready|Paid|Completed|Active|Online|Picked up|Checked in/.test(s)?'ok':/Refund|Declined|Offline/.test(s)?'bad':/New|Open|In progress|Pending|Waiting/.test(s)?'warn':'');

function sheet(html){const s=$('#sheet');s.innerHTML=`<div class="sh" onclick="event.stopPropagation()">${html}</div>`;s.className='on';s.onclick=closeSheet}
function closeSheet(){const s=$('#sheet');s.className='';s.innerHTML=''}
function mtoast(m){const t=document.createElement('div');t.className='tm';t.innerHTML=m;const T=$('#toastm');T.appendChild(t);while(T.children.length>2)T.firstChild.remove();setTimeout(()=>t.remove(),2600)}

function drawSync(){const el=$('#sync');if(!el)return;el.innerHTML=SYNC.length?SYNC.map(e=>`<div class="ev"><b>${esc(e.title)}</b><span>${e.t} · ${esc(e.detail)}</span>${e.hash?`<br><a href="${portalUrl(e.hash)}" target="_blank" rel="noopener">${esc(e.label||'View in portal')} ›</a>`:''}</div>`).join(''):'<div class="empty">Take a payment, enroll a customer or sell a gift card – each action shows up here with a link to where it lands in the Elavon One Portal.</div>'}

 <div style="margin-top:12px"><a class="mb sec" href="${portalUrl(EXP[A.seg].home)}" target="_blank" rel="noopener" onclick="return openBO('${EXP[A.seg].home}')">${ic('ext',17)}Open back office (Elavon One Portal)</a></div>${A.bare?`<p class="mut sm ctr" style="margin:10px 0 0">Open this page on a tablet or computer to preview the Castles terminals.</p>`:''}`)}

 const go=()=>{$('#toastm').innerHTML='';closeBO();A.seg=k;try{history.replaceState(null,'','#'+k+'/'+A.dev)}catch(_){}draw();drawStage()};
 if(quiet){go();return}const sp=$('#splash');sp.style.setProperty('--p',k==='ent'?'#1E4D3B':'#02025B');sp.innerHTML=`<div class="avx" style="color:${e.color}">${e.ini}</div><div style="font-size:19px">${esc(e.name)}</div><div style="opacity:.8;font-size:13px">${e.sub}</div>`;sp.className='on';setTimeout(go,450);setTimeout(()=>sp.className='',950)}

const GUIDE={smb:['Tap menu items to build an order – try one with options, like the burger.','Open the order, add a customer (Ashley Turner) and redeem her loyalty reward.','Charge: pick a tip, then pay part with a gift card and the rest by card.','Send the receipt, then check Activity – and the same sale in the portal.','Orders: pay Table 4, or accept an online order. More: sell a gift card.'],

function drawStage(){const d=D(),dv=$('#device');dv.className='dev '+d.cls;dv.style.setProperty('--sw',d.w+'px');dv.style.setProperty('--sh',d.h+'px');$$('.deco',dv).forEach(e=>e.remove());dv.insertAdjacentHTML('beforeend',d.deco+(d.cls==='dev-mini'?`<div class="deco nfc">${ic('nfc',18)}</div>`:'')+(d.cls==='dev-s2'?'':''));const rd=$('.dev-s2 .rdr');if(rd)rd.innerHTML=ic('nfc',26);
 $('.status').innerHTML=`<span>9:41</span><span class="ri">${d.phone?'5G':'Wi-Fi'} · ${d.phone?'':'⚡ '}87%</span>`;

 $('#segs').innerHTML=Object.entries(EXP).map(([k,e])=>`<button class="dopt ${A.seg===k?'on':''}" onclick="switchSeg('${k}')"><span class="di" style="${A.seg===k?`background:${e.color}`:''}">${e.ini}</span><span><b>${esc(e.name)}</b><span>${e.sub}</span></span></button>`).join('');
 $('#guide').innerHTML=GUIDE[A.seg].map(g=>`<li>${g}</li>`).join('');
 $('#selDev').innerHTML=Object.entries(DEV).map(([k,x])=>`<option value="${k}" ${A.dev===k?'selected':''}>${x.name}</option>`).join('');
 $('#selSeg').innerHTML=Object.entries(EXP).map(([k,e])=>`<option value="${k}" ${A.seg===k?'selected':''}>${e.short}</option>`).join('');
 $('#boLink').href=portalUrl(EXP[A.seg].home);$('#dcap').textContent=`${d.name} · ${d.os} · ${d.spec}`;fit()}

/* ---------- Printed receipt shown beside the S1F4 Pro ---------- */
function showRcpt(html){const r=$('#rcpt');r.innerHTML=`<div class="rp">${html}</div><div class="rhint">Click the receipt to dismiss</div>`;r.className='on';placeRcpt()}
function placeRcpt(){const r=$('#rcpt');if(!r||r.className!=='on')return;const c=$('.dcenter').getBoundingClientRect(),d=$('#device').getBoundingClientRect();let x=d.right-c.left+22;const w=r.offsetWidth;if(x+w>c.width-8)x=Math.max(8,c.width-w-8);r.style.left=x+'px';r.style.top=Math.max(10,d.top-c.top+6)+'px';r.style.maxHeight=(c.height-40)+'px'}
function hideRcpt(){const r=$('#rcpt');if(r){r.className='';r.innerHTML=''}}

/* ===== Shared payment flow: tip → method → card / gift card / cash / pay link → receipt → done ===== */
let PAY=null;
const payTotal=()=>r2(PAY.base+PAY.tip),payDue=()=>r2(payTotal()-sum(PAY.tenders,t=>t.amount));
function startPay(o){PAY={o,base:r2(o.amount),tip:0,tenders:[],step:o.tipping?'tip':'method',pin:'',change:0,receipt:''};drawPay()}
function drawPay(){const el=$('#payov');if(!PAY){el.className='';el.innerHTML='';return}el.className='on';el.dataset.theme=THEME();el.innerHTML=`<div class="pv">${PAYSTEP[PAY.step]()}</div>`}
function payGo(s){PAY.step=s;drawPay()}
function payCancel(){PAY=null;drawPay()}
const pvh=(t,back)=>`<div class="pvh">${back?`<button class="hbtn" onclick="${back}">${ic(back==='payCancel()'?'x':'back',20)}</button>`:''}<b>${t}</b>${PAY.o.merchant?`<span class="sm" style="opacity:.8">${esc(PAY.o.merchant)}</span>`:''}</div>`;
const SIMCARDS={tapcard:{brand:'Visa',last4:'4821',entry:'Contactless card'},wallet:{brand:'Mastercard',last4:'7714',entry:'Digital wallet'},chip:{brand:'Visa Debit',last4:'0932',entry:'Chip + PIN'},swipe:{brand:'Amex',last4:'1009',entry:'Swipe'}};
const PAYSTEP={
 tip(){const b=PAY.base;return pvh('Add a tip?','payCancel()')+`<div class="pvb c"><div class="mut">Order total</div><div class="amt">${money(b)}</div><div class="tips">${[18,20,22].map(p=>`<button onclick="paySetTip(${r2(b*p/100)})">${p}%<span>${money(b*p/100)}</span></button>`).join('')}</div><div class="brow" style="width:100%"><button class="mb sec" onclick="payCustomTip()">Custom</button><button class="mb sec" onclick="paySetTip(0)">No tip</button></div><div class="mut sm">Customer-facing screen – hand the device to your guest</div></div>`},
 method(){const d=D(),due=payDue(),o=PAY.o,part=PAY.tenders.length;const cardLbl=d.phone?[d.spec,'Customer taps a card, phone or watch on this '+(d.os==='iOS'?'iPhone':'phone')]:['Card','Tap, insert'+(d.entry.includes('swipe')?' or swipe':'')+' on the '+d.name];
  return pvh(part?'Remaining balance':'Take payment','payCancel()')+`<div class="pvb"><div class="ctr"><div class="mut">${part?'Still due':'Amount due'}</div><div class="amt">${money(due)}</div>${PAY.tip?`<div class="mut sm">Includes ${money(PAY.tip)} tip</div>`:''}${PAY.tenders.map(t=>`<div class="sm" style="color:var(--ok)">${ic('check',13)} ${esc(tenderLabel(t))} · ${money(t.amount)}</div>`).join('')}</div>
  <button class="meth" onclick="payGo('card')"><span class="mi">${ic('nfc',22)}</span><span><b>${cardLbl[0]}</b><span>${cardLbl[1]}</span></span></button>
  <button class="meth" onclick="payGo('gift')"><span class="mi">${ic('gift',22)}</span><span><b>Gift card</b><span>Scan or enter a card – split the rest</span></span></button>
  ${o.cash?`<button class="meth" onclick="payGo('cash')"><span class="mi">${ic('cash',22)}</span><span><b>Cash</b><span>Record cash and open the drawer</span></span></button>`:''}
  ${o.link?`<button class="meth" onclick="payGo('link')"><span class="mi">${ic('link',22)}</span><span><b>Text a pay link</b><span>Customer pays on their own phone</span></span></button>`:''}</div>`},
 card(){const d=D();return pvh(d.phone?d.spec:'Present card','payGo(\'method\')')+`<div class="pvb c"><div class="amt">${money(payDue())}</div><div class="reader">${ic('nfc',64)}</div><b style="font-size:17px;font-weight:500">${d.phone?'Hold card or device near the '+(d.os==='iOS'?'top of this iPhone':'back of this phone'):'Tap, insert'+(d.entry.includes('swipe')?' or swipe':'')}</b><div class="mut sm">${d.phone?'No extra hardware needed – contactless cards and digital wallets accepted':'Chip slot at the base'+(d.entry.includes('swipe')?' · swipe on the side':'')+' · contactless on screen'}</div>
  <div class="sim"><small>Demo – simulate the customer</small><div class="sg"><button onclick="paySim('tapcard')">Tap card</button><button onclick="paySim('wallet')">Tap phone / watch</button>${d.entry.includes('chip')?`<button onclick="paySim('chip')">Insert chip</button>`:''}${d.entry.includes('swipe')?`<button onclick="paySim('swipe')">Swipe</button>`:''}<button onclick="paySim('decline')" style="color:var(--bad)">Declined card</button></div></div></div>`},
 pin(){return pvh('Enter PIN')+`<div class="pvb c"><div class="mut">Visa Debit ••0932 · ${money(payDue())}</div><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<PAY.pin.length?'f':''}"></i>`).join('')}</div><div class="pinp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="payPin('${k}')">${k}</button>`).join('')}</div><div class="mut sm">PIN on glass · any 4 digits for the demo</div></div>`},
 processing(){return pvh('Processing')+`<div class="pvb c"><div class="spin"></div><b style="font-weight:500">Authorizing with Elavon…</b><div class="mut sm">Encrypted end to end</div></div>`},
 approved(){const t=PAY.tenders[PAY.tenders.length-1];return pvh('Approved')+`<div class="pvb c"><div class="okc">${ic('check',44)}</div><div class="amt">${money(t.amount)}</div><b style="font-weight:500">${esc(tenderLabel(t))}</b>${t.auth?`<div class="mut sm">Auth ${t.auth}</div>`:''}</div>`},
 declined(){return pvh('Declined','payGo(\'method\')')+`<div class="pvb c"><div class="okc bad">${ic('x',44)}</div><b style="font-size:17px;font-weight:500">Card declined</b><div class="mut">Do not honor – ask for another form of payment</div><button class="mb" onclick="payGo('card')">Try another card</button><button class="mb sec" onclick="payGo('method')">Other payment method</button></div>`},
 gift(){const g=PAY.o.gc||[];return pvh('Gift card','payGo(\'method\')')+`<div class="pvb"><div class="ctr"><div class="mut">Amount due</div><div class="amt">${money(payDue())}</div></div><input class="inp" id="gcIn" placeholder="Scan or enter card number" style="margin:0"><button class="mb sec" onclick="payGift($('#gcIn').value.trim().toUpperCase())">${ic('scan',18)}Look up card</button><div class="card" style="margin:0"><h3>Demo cards</h3>${g.filter(c=>c.bal>0).slice(0,4).map(c=>lrow(ic('gift',18),c.code,esc(c.owner||'Gift card'),money(c.bal),`payGift('${c.code}')`)).join('')||'<div class="mut sm">No active cards</div>'}</div></div>`},
 cash(){const due=payDue(),opts=[...new Set([due,Math.ceil(due/5)*5,Math.ceil(due/10)*10,Math.ceil(due/20)*20,Math.ceil(due/50)*50])].slice(0,4);return pvh('Cash','payGo(\'method\')')+`<div class="pvb c"><div class="mut">Amount due</div><div class="amt">${money(due)}</div><div class="mut">Cash received</div><div class="tips" style="grid-template-columns:repeat(2,1fr)">${opts.map((v,i)=>`<button onclick="payCash(${v})">${i?money(v):'Exact'}<span>${i?'Change '+money(v-due):money(v)}</span></button>`).join('')}</div></div>`},
 link(){const c=PAY.o.customer;return pvh('Pay link','payGo(\'method\')')+`<div class="pvb"><div class="ctr"><div class="mut">Amount</div><div class="amt">${money(payDue())}</div></div><input class="inp" id="plIn" value="${esc(c?c.phone:'')}" placeholder="Mobile number" style="margin:0"><button class="mb" onclick="payLink()">${ic('msg',18)}Text secure pay link</button><div class="mut sm ctr">Hosted checkout by Elavon – card details never touch this device</div></div>`},
 linkwait(){return pvh('Waiting for customer')+`<div class="pvb c"><div class="spin"></div><b style="font-weight:500">Pay link sent</b><div class="mut sm">Customer is completing payment on their phone…</div></div>`},
 receipt(){const c=PAY.o.customer,d=D();return pvh('Receipt')+`<div class="pvb"><div class="ctr"><div class="okc" style="margin:0 auto 8px;width:60px;height:60px">${ic('check',32)}</div><div class="amt">${money(payTotal())}</div><div class="mut">Paid${PAY.change?` · change due ${money(PAY.change)}`:''}</div></div>
  <button class="meth" onclick="payReceipt('text')"><span class="mi">${ic('msg',22)}</span><span><b>Text</b><span>${c&&c.phone?esc(c.phone):'Enter mobile number'}</span></span></button>
  <button class="meth" onclick="payReceipt('email')"><span class="mi">${ic('mail',22)}</span><span><b>Email</b><span>${c&&c.email?esc(c.email):'Enter email address'}</span></span></button>

const TS={team:[['Kayla Nguyen','Server',6.5],['Jordan Price','Server',7],['Tyler Green','Server',5],['Ava Thompson','Bartender',8],['Priya Shah','Host',6],['Luis Ramirez','Kitchen',8],['Marcus Hill','Kitchen',7.5],['Ben Carter','Kitchen',6]].map(([n,role,hrs],i)=>({id:'e'+i,n,role,hrs,on:true})),w:{Server:10,Bartender:8,Host:4,Kitchen:3},cash:86,paidBase:0,paidAt:'',instant:true,
 hist:[['Tue, Nov 10',1284.6,8],['Mon, Nov 9',962.15,7],['Sun, Nov 8',1731.4,9],['Sat, Nov 7',2105.9,10]].map(([d,amt,n])=>({d,amt,n}))};

 <div class="brow" style="margin-bottom:10px"><button class="mb sec sm" onclick="tsCash()">${ic('cash',16)}Declare cash tips</button><button class="mb sec sm" onclick="tab('rules')">${ic('sliders',16)}Split rules</button></div>
 <div class="card"><h3>Tonight’s split · hours × role points</h3>${sh.map(x=>lrow(ini(x.e.n),esc(x.e.n),`${x.e.role} · ${x.e.hrs} h · ${x.pts} pts`,money(x.amt))).join('')||'<div class="mut">Nobody is on the clock</div>'}</div>${dFoot()}`,
 foot:`<button class="mb" ${pool>0?'':'disabled'} onclick="tsPayAsk()">${ic('zap',18)}Close shift · pay out ${money(pool)}</button>`})}

function tsPayAsk(){const sh=tsShares();sheet(`<h2>Pay out ${money(tsPool())}?</h2><p class="mut">${sh.length} team members are paid ${TS.instant?'instantly to their debit cards':'on the next payroll run'} through Elavon payouts.</p>${sh.slice(0,4).map(x=>`<div class="tot"><span>${esc(x.e.n)}</span><span>${money(x.amt)}</span></div>`).join('')}${sh.length>4?`<div class="mut sm">+ ${sh.length-4} more</div>`:''}<button class="mb" style="margin-top:12px" onclick="tsPay()">Confirm payout</button>`)}

function tsTeam(){return view({head:dHead('Team',{sub:'Hours synced from Elavon POS timecards'}),body:`<div class="card">${TS.team.map(e=>`<div class="cl" style="align-items:center"><div class="cm"><b>${esc(e.n)}</b><span>${e.role} · ${e.on?'in tonight’s pool':'not in pool'}</span></div><div class="qty"><button onclick="tsHrs('${e.id}',-.5)">−</button><em style="min-width:38px">${e.hrs} h</em><button onclick="tsHrs('${e.id}',.5)">+</button></div><span class="pl ${e.on?'ok':''}" onclick="TS.team.find(x=>x.id==='${e.id}').on=!${e.on};draw()" style="cursor:pointer">${e.on?'In':'Out'}</span></div>`).join('')}</div>`})}

PAGES.llJoin=()=>view({tabs:false,head:dHead('Join Peach Perks',{back:"LL.entry='';pop()",sub:llFmt(LL.entry)}),body:`<div class="ctr mut" style="margin-bottom:10px">New here – join in one tap and start with 25 points.</div><input class="inp" id="llN" placeholder="First name (optional)"><button class="mb" onclick="llEnroll()">Join · 25 bonus points</button><p class="mut sm ctr">We’ll text your rewards. Message rates may apply.</p>`});
function llEnroll(){const s=STORES.pp,n=($('#llN').value.trim()||'Guest')+' '+LL.entry.slice(-4),c={id:uid('c'),name:n,phone:llFmt(LL.entry),email:'',pts:25,visits:1,spend:0,fav:'—',last:'Today'};s.cust.unshift(c);LL.visits++;logSync(`LoyaltyLoop enrollment: ${n}`,'25 bonus points · synced to Elavon POS customers','partner/app/app_loyalty','Developer Center › LoyaltyLoop');nav().stack=[{fn:'llMember',arg:c.id}];mtoast('Welcome – 25 points added');draw()}
function llMembers(){const s=STORES.pp;return view({head:dHead('Members',{sub:`${s.cust.length} members · ${LL.visits} check-ins today`}),body:`<div class="card">${[...s.cust].sort((a,b)=>b.pts-a.pts).map(c=>lrow(ini(c.name),esc(c.name),c.phone,`${c.pts} pts`,`push('llMember','${c.id}')`)).join('')}</div>${dFoot()}`})}
function llOffers(){return view({head:dHead('Offers',{sub:'Automated text campaigns'}),body:`<div class="card">${LL.offers.map((o,i)=>`<div class="cl" style="align-items:center"><div class="cm"><b>${esc(o.n)}</b><span>${o.aud} members match${o.sent?` · sent ${o.sent}`:''}</span></div><span class="pl ${o.on?'ok':''}" style="cursor:pointer" onclick="LL.offers[${i}].on=!${o.on};draw()">${o.on?'Auto':'Off'}</span><button class="mb sm" onclick="llSend(${i})">Send</button></div>`).join('')}</div>`})}
function llSend(i){const o=LL.offers[i];o.sent+=o.aud;mtoast(`Texted ${o.aud} members`);logSync(`LoyaltyLoop campaign sent`,`${o.n} · ${o.aud} texts`,'partner/app/app_loyalty','Developer Center › LoyaltyLoop');draw()}

/* ---------- CurbsideNow (Castles S1F4 Pro) ---------- */
const CB={geo:true,auto:true,spots:6,orders:[{id:'#4819',name:'Omar Haddad',car:'Gray Honda CR-V',spot:3,status:'Arrived',paid:true,wait:Date.now()-140000,items:[['Shrimp & Grits',2,18.5],['Peach Cobbler',2,8]]},{id:'#4823',name:'Paige Sullivan',car:'White Tesla Model 3',spot:5,status:'Arrived',paid:false,wait:Date.now()-45000,items:[['Hot Chicken Sandwich',1,15],['Hand-cut Fries',1,5],['Sweet Tea',2,3.5]]},{id:'#4824',name:'Brian Walsh',car:'Blue Ford F-150',spot:0,status:'Ready',paid:true,items:[['Chicken & Waffles',1,17],['Oat Milk Latte',1,5.75]]},{id:'#4825',name:'Elena Garcia',car:'Red Mazda CX-5',spot:0,status:'Ready',paid:false,items:[['Pimento Cheese Burger',2,16],['Mac & Cheese',1,7]]},{id:'#4826',name:'Grace Lee',car:'Black Subaru Outback',spot:0,status:'Preparing',paid:true,items:[['Georgia Peach Salad',1,13],['Banana Pudding',1,7]]}],done:14};
const cbTot=o=>r2(sum(o.items,i=>i[1]*i[2])*1.089),cbO=id=>CB.orders.find(o=>o.id===id);
const cbRow=o=>lrow(o.status==='Arrived'?`<b style="font-size:16px">${o.spot}</b>`:ic('truck',18),`${o.id} · ${esc(o.name)}`,`${esc(o.car)}${o.status==='Arrived'?` · waiting <span class="ktm" data-t="${o.wait}"></span>`:''}`,`${o.paid?stPill('Paid'):pl('Pay at car','warn')}<br>${stPill(o.status==='Arrived'?'Waiting':o.status==='Preparing'?'In progress':o.status)}`,`push('cbOrder','${o.id}')`);
function cbArr(){const arr=CB.orders.filter(o=>o.status==='Arrived'),rdy=CB.orders.filter(o=>o.status==='Ready');return view({head:dHead('CurbsideNow',{sub:`Peach & Pine Bistro · ${CB.spots} curbside spots`}),body:`<div class="kp"><div><span>At the curb</span><b>${arr.length}</b></div><div><span>Handed off today</span><b>${CB.done}</b></div></div><div class="card"><h3>Customers here now</h3>${arr.map(cbRow).join('')||'<div class="mut ctr" style="padding:14px 0">No one is waiting</div>'}</div><div class="card"><h3>Ready · on their way</h3>${rdy.map(cbRow).join('')||'<div class="mut sm">Nothing ready</div>'}</div><div class="sim" style="margin-top:4px"><small>Demo – simulate the customer</small><button style="width:100%" ${rdy.length?'':'disabled'} onclick="cbArrive()">Customer taps “I’m here”</button></div>`})}
function cbArrive(){const o=CB.orders.find(o=>o.status==='Ready');if(!o)return;const used=CB.orders.filter(x=>x.status==='Arrived').map(x=>x.spot);o.spot=[1,2,3,4,5,6].find(n=>!used.includes(n))||1;o.status='Arrived';o.wait=Date.now();mtoast(`${esc(o.name)} arrived · spot ${o.spot}`);logSync(`CurbsideNow arrival: ${o.id}`,`${o.name} · spot ${o.spot} · geofence`,'partner/app/app_curb','Developer Center › CurbsideNow');draw()}
function cbOrd(){const grp=s=>CB.orders.filter(o=>o.status===s);return view({head:dHead('Orders',{sub:'Curbside pickup'}),body:['Preparing','Ready','Arrived'].map(s=>`<div class="card"><h3>${s==='Arrived'?'At the curb':s} (${grp(s).length})</h3>${grp(s).map(cbRow).join('')||'<div class="mut sm">None</div>'}</div>`).join('')})}
PAGES.cbOrder=id=>{const o=cbO(id);if(!o){nav().stack=[];return cbArr()}const tot=cbTot(o);return view({tabs:false,head:dHead(`${o.id} · ${esc(o.name)}`,{back:true,sub:o.status==='Arrived'?`Spot ${o.spot} · ${esc(o.car)}`:esc(o.car)}),body:`${o.status==='Arrived'?`<div class="hero2"><div class="mut sm">Waiting at the curb</div><div class="big">Spot ${o.spot}</div><div class="mut sm">${esc(o.car)} · <span class="ktm" data-t="${o.wait}"></span></div></div>`:''}<div class="card"><h3>Order ${o.paid?stPill('Paid'):pl('Pay at car','warn')}</h3>${o.items.map(i=>`<div class="cl"><div class="cm"><b>${i[1]} × ${esc(i[0])}</b></div><div>${money(i[1]*i[2])}</div></div>`).join('')}<div class="tot g"><span>Total with tax</span><span>${money(tot)}</span></div></div><button class="mb sec" onclick="mtoast('Text sent: “We’re bringing your order out now”')">${ic('msg',17)}Text customer</button>`,
 foot:o.status==='Preparing'?`<button class="mb" onclick="cbO('${id}').status='Ready';mtoast('Marked ready · customer texted');draw()">Mark ready – notify customer</button>`:!o.paid?`<button class="mb" onclick="cbPay('${id}')">${ic('nfc',18)}Take payment at the car · ${money(tot)}</button>`:`<button class="mb" onclick="cbDone('${id}')">${ic('check',18)}Hand off – complete order</button>`})};
function cbPay(id){const o=cbO(id),tot=cbTot(o),sub=sum(o.items,i=>i[1]*i[2]);startPay({amount:tot,tipping:true,cash:false,gc:STORES.pp.gc,customer:{phone:'',email:''},merchant:'Peach & Pine Bistro',doneLabel:'Back to order',rc:{lines:o.items.map(i=>({n:i[0],q:i[1],p:i[2]})),sub,tax:r2(tot-sub),addr:'Curbside pickup · order '+o.id,emp:'CurbsideNow',foot:'Thanks for picking up curbside'},onDone:res=>{o.paid=true;STORES.pp.tx.unshift({id:'TX'+ri(9200,9999),time:tnow(),lines:o.items.map(i=>({name:i[0],qty:i[1],price:i[2],mods:[]})),total:r2(res.total-res.tip),tip:res.tip,tenders:res.tenders,cust:o.name,status:'Approved',emp:'CurbsideNow'});logSync(`CurbsideNow payment ${o.id} · ${money(res.total)}`,`Paid at the car · ${res.tenders.map(tenderLabel).join(' + ')}`,'partner/app/app_curb','Developer Center › CurbsideNow');return `<div class="card" style="margin:0"><h3>Next step</h3><div class="mut sm">Hand the order to ${esc(o.name)} in spot ${o.spot||'—'} and complete it.</div></div>`}})}
function cbDone(id){const o=cbO(id);CB.orders=CB.orders.filter(x=>x.id!==id);CB.done++;mtoast(`${o.id} handed off`);logSync(`CurbsideNow hand-off: ${o.id}`,`${o.name} · order completed`,'partner/app/app_curb','Developer Center › CurbsideNow');nav().stack=[];draw()}
function cbSet(){return view({head:dHead('Settings',{sub:'CurbsideNow'}),body:`<div class="card"><h3>Arrivals</h3>${lrow(ic('pin',18),'Geofenced arrival','Alert when the customer is 2 minutes away',pl(CB.geo?'On':'Off',CB.geo?'ok':''),'CB.geo=!CB.geo;draw()')}${lrow(ic('msg',18),'Automatic texts','Ready, on our way, thank you',pl(CB.auto?'On':'Off',CB.auto?'ok':''),'CB.auto=!CB.auto;draw()')}<div class="cl" style="align-items:center"><div class="cm"><b>Curbside spots</b><span>Numbered parking spaces</span></div><div class="qty"><button onclick="CB.spots=Math.max(1,CB.spots-1);draw()">−</button><em>${CB.spots}</em><button onclick="CB.spots++;draw()">+</button></div></div></div>${dFoot()}`})}

/* ---------- KitchenFlow KDS (Castles S2Pro i16) ---------- */
const KST={Mains:'Grill',Breakfast:'Grill',Sides:'Fry',Desserts:'Cold',Drinks:'Bar',Bar:'Bar',Retail:'Expo'};
const KDS={station:'All',tix:[],recall:[],n:41,served:63,warn:6,late:10};
function kdsMk(label,server,ageSec,names){return {id:'k'+(KDS.n++),label,server,t0:Date.now()-ageSec*1000,items:names.map(([n,mods])=>{const it=STORES.pp.items.find(i=>i.name===n);return {n,mods:mods||[],st:KST[it?it.cat:'Mains']||'Grill',done:false}})}}
KDS.tix=[kdsMk('Table 4','Kayla',512,[['Shrimp & Grits'],['Pimento Cheese Burger',['Medium','Bacon']],['Sweet Tea']]),kdsMk('Online #4821','Web pickup',388,[['Hot Chicken Sandwich',['Hot']],['Hot Chicken Sandwich',['Mild']],['Mac & Cheese']]),kdsMk('Table 7','Jordan',214,[['Chicken & Waffles'],['Chicken & Waffles'],['Fried Green Tomatoes'],['Peach Bellini'],['Peach Bellini']]),kdsMk('Table 11','Sofia',131,[['Georgia Peach Salad',['Grilled chicken']],['Hand-cut Fries'],['Local IPA (draft)']]),kdsMk('Curbside #4826','CurbsideNow',64,[['Georgia Peach Salad'],['Banana Pudding']]),kdsMk('Table 2','Tyler',22,[['Pecan Pancakes'],['Biscuit Board'],['Oat Milk Latte'],['Cold Brew',['Oat']]])];
function kdsPush(label,lines,server){const names=[];lines.filter(l=>!l.gc).forEach(l=>{for(let i=0;i<l.qty;i++)names.push([l.name,l.mods])});if(names.length)KDS.tix.push(kdsMk(label,(server||'POS').split(' ')[0],0,names))}
const kFmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function kdsTix(){const st=KDS.station,list=KDS.tix.filter(t=>st==='All'||t.items.some(i=>i.st===st));return view({wide:true,head:dHead('KitchenFlow KDS',{sub:`Peach & Pine Bistro · ${KDS.tix.length} open · ${KDS.served} served today`,right:`<span class="pl" style="background:#2B313C;color:#fff">Avg ticket 7:42</span>`}),body:`<div class="chips">${['All','Grill','Fry','Cold','Bar'].map(s=>`<button class="chip ${st===s?'on':''}" onclick="KDS.station='${s}';draw()">${s}${s==='All'?'':' · '+sum(KDS.tix,t=>t.items.filter(i=>i.st===s&&!i.done).length)}</button>`).join('')}<span style="flex:1"></span><button class="chip" onclick="kdsNew()">+ Simulate new order</button></div><div class="kgrid">${list.map(t=>{const its=t.items.filter(i=>st==='All'||i.st===st),all=t.items.every(i=>i.done);return `<div class="kt ${all?'rdy':''}"><div class="kth"><b>${esc(t.label)}</b><span class="ktm" data-t="${t.t0}" data-k="1"></span></div><div class="kts">${esc(t.server)} · ${t.items.filter(i=>i.done).length}/${t.items.length} done</div>${its.map(i=>`<button class="kti ${i.done?'dn':''}" onclick="kdsItem('${t.id}',${t.items.indexOf(i)})"><span>${esc(i.n)}${i.mods.length?`<i>${i.mods.map(esc).join(' · ')}</i>`:''}</span><em>${i.st}</em></button>`).join('')}<button class="ktb" onclick="kdsBump('${t.id}')">${all?'Bump – order up':'Bump'}</button></div>`}).join('')||'<div class="mut" style="padding:30px">All caught up</div>'}</div>`})}
function kdsItem(id,i){const t=KDS.tix.find(x=>x.id===id);t.items[i].done=!t.items[i].done;draw()}
function kdsBump(id){const t=KDS.tix.find(x=>x.id===id);KDS.tix=KDS.tix.filter(x=>x.id!==id);t.secs=(Date.now()-t.t0)/1000;t.items.forEach(i=>i.done=true);KDS.recall.unshift(t);KDS.served++;mtoast(`${esc(t.label)} bumped · ${kFmt(t.secs)}`);logSync(`KitchenFlow: ${t.label} bumped`,`${t.items.length} items · ${kFmt(t.secs)} ticket time`,'partner/app/app_kitchen','Developer Center › KitchenFlow KDS');draw()}
function kdsNew(){const s=STORES.pp,food=s.items.filter(i=>!['Retail'].includes(i.cat)),n=ri(2,4);KDS.tix.push(kdsMk(pick(['Table 3','Table 6','Table 9','Table 14','Online #'+ri(4830,4899),'Bar tab']),pick(['Kayla','Jordan','Tyler','Sofia']),0,Array.from({length:n},()=>[pick(food).name])));draw()}
function kdsAllDay(){const m={};KDS.tix.forEach(t=>t.items.filter(i=>!i.done).forEach(i=>{m[i.n]=m[i.n]||{c:0,st:i.st};m[i.n].c++}));const rows=Object.entries(m).sort((a,b)=>b[1].c-a[1].c);return view({wide:true,head:dHead('All day',{sub:'Open item counts across tickets'}),body:`<div class="kgrid">${rows.map(([n,v])=>`<div class="kt"><div class="kth"><b style="font-size:26px">${v.c}×</b><span class="pl" style="background:#2B313C;color:#fff">${v.st}</span></div><div style="font-size:16px;margin-top:4px">${esc(n)}</div></div>`).join('')||'<div class="mut" style="padding:30px">Nothing open</div>'}</div>`})}
function kdsRecall(){return view({wide:true,head:dHead('Recall',{sub:'Recently bumped tickets'}),body:`<div class="kgrid">${KDS.recall.slice(0,12).map(t=>`<div class="kt rdy"><div class="kth"><b>${esc(t.label)}</b><span>${kFmt(t.secs)}</span></div><div class="kts">${t.items.length} items · ${esc(t.server)}</div><button class="ktb" onclick="kdsUn('${t.id}')">Recall to line</button></div>`).join('')||'<div class="mut" style="padding:30px">Bumped tickets appear here</div>'}</div>`})}
function kdsUn(id){const t=KDS.recall.find(x=>x.id===id);KDS.recall=KDS.recall.filter(x=>x.id!==id);t.items.forEach(i=>i.done=false);KDS.tix.unshift(t);nav().tab='tix';draw()}
function kdsSet(){return view({head:dHead('Setup',{sub:'KitchenFlow KDS'}),body:`<div class="card"><h3>Ticket timing</h3><div class="cl" style="align-items:center"><div class="cm"><b>Warn after</b><span>Ticket turns amber</span></div><div class="qty"><button onclick="KDS.warn=Math.max(1,KDS.warn-1);draw()">−</button><em>${KDS.warn} m</em><button onclick="KDS.warn++;draw()">+</button></div></div><div class="cl" style="align-items:center"><div class="cm"><b>Late after</b><span>Ticket turns red</span></div><div class="qty"><button onclick="KDS.late=Math.max(KDS.warn+1,KDS.late-1);draw()">−</button><em>${KDS.late} m</em><button onclick="KDS.late++;draw()">+</button></div></div></div><div class="card"><h3>Sources</h3>${lrow(ic('grid',18),'Elavon POS','Tables, bar tabs and to-go',stPill('Online'))}${lrow(ic('bag',18),'Online ordering','Web, QR and curbside',stPill('Online'))}</div>${dFoot()}`})}
/* live timers (KDS tickets and curbside waits) */
setInterval(()=>{$$('.ktm').forEach(e=>{const s=(Date.now()-+e.dataset.t)/1000;e.textContent=kFmt(s);if(e.dataset.k)e.className='ktm '+(s>KDS.late*60?'late':s>KDS.warn*60?'warn':'')})},1000);
new MutationObserver(()=>$$('.ktm:empty').forEach(e=>{const s=(Date.now()-+e.dataset.t)/1000;e.textContent=kFmt(s);if(e.dataset.k)e.className='ktm '+(s>KDS.late*60?'late':s>KDS.warn*60?'warn':'')})).observe(document.documentElement,{childList:true,subtree:true});
</script>
</body></html>
