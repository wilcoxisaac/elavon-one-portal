<style>:root{--elavon:#02025B;--bright:#005DED;--lgray:#EBEFF6;--line:#DCE0EB;--gray7:#63637F;--lblue:#E1F5FF;--mblue:#C0E7FF}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 "U.S. Bank Circular","Circular Std",Arial,Helvetica,sans-serif;color:#111122;background:var(--lgray);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--bright);text-decoration:none}
/* ===== Demo stage ===== */
.dbar{height:60px;background:var(--elavon);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px}
.dbar img{height:32px}.dbar .t{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;opacity:.85;border-left:1px solid #ffffff40;padding-left:14px}
.dbar .sp{flex:1}
.dbar a.bo{color:#fff;border:1px solid #ffffff50;border-radius:999px;padding:7px 16px;font-weight:500;display:flex;gap:8px;align-items:center;white-space:nowrap}
.dbar a.bo:hover{background:#ffffff1a}
.dmain{display:grid;grid-template-columns:290px minmax(0,1fr) 310px;height:calc(100vh - 60px);height:calc(100dvh - 60px)}
.dside{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto}
.dside.r{border-right:0;border-left:1px solid var(--line)}
.dside h4{margin:0 0 8px;font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gray7)}
.dside h4:not(:first-child){margin-top:20px}
.dopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;margin-bottom:6px;color:var(--elavon)}
.dopt:hover{border-color:var(--elavon)}
.dopt.on{background:var(--lblue);border-color:var(--bright)}
.dopt b{display:block;font-weight:500}.dopt span{font-size:12px;color:var(--gray7)}
.dopt .di{width:34px;height:34px;border-radius:9px;background:var(--lgray);display:grid;place-items:center;flex:none;color:var(--elavon)}
.dopt.on .di{background:var(--bright);color:#fff}
.guide{counter-reset:g;margin:0;padding:0;list-style:none}
.guide li{counter-increment:g;display:flex;gap:10px;padding:6px 0;font-size:13px;color:#33334D}
.guide li:before{content:counter(g);width:20px;height:20px;border-radius:50%;background:var(--elavon);color:#fff;font-size:11px;display:grid;place-items:center;flex:none;margin-top:1px}
.dbtn{border:1px solid #CDD1E2;background:#fff;border-radius:999px;padding:7px 14px;color:var(--elavon);font-weight:500;width:100%;margin-top:12px}
.dbtn:hover{border-color:var(--elavon)}
.dcenter{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,#fff,#EBEFF6 70%)}
.dcap{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:var(--gray7)}
#devwrap{position:relative}
.sync{font-size:13px}
.sync .ev{padding:9px 0;border-bottom:1px solid #EEF1F5;animation:evin .35s}
.sync .ev b{color:var(--elavon);font-weight:500;display:block}.sync .ev span{color:var(--gray7);font-size:12px}
.sync .ev a{font-size:12px;font-weight:500}
@keyframes evin{from{background:var(--lblue)}}
.sync .empty{color:var(--gray7);padding:8px 0}
.dtool{display:none}
/* ===== Devices ===== */
.dev{position:relative;transform-origin:top left;background:#15161A;box-shadow:0 30px 60px #02025B30,inset 0 0 0 2px #2c2d33}
.screen{position:relative;width:var(--sw);height:var(--sh);background:#fff;overflow:hidden;container-type:inline-size;container-name:scr;display:flex;flex-direction:column}
.dev-iphone{padding:12px;border-radius:58px}.dev-iphone .screen{border-radius:46px}
.dev-android{padding:10px;border-radius:44px;background:#1d1f24}.dev-android .screen{border-radius:34px}
.dev-mini{padding:26px 14px 50px;border-radius:26px;background:#23252B}.dev-mini .screen{border-radius:6px}
.dev-f4{padding:104px 13px 30px;border-radius:26px;background:#1B1C21}.dev-f4 .screen{border-radius:8px}
.dev-s2{padding:20px 20px 22px;border-radius:18px;background:#1B1C21;margin-bottom:96px}.dev-s2 .screen{border-radius:4px}
.deco{position:absolute;pointer-events:none}
.dev-iphone .island{left:50%;top:23px;width:112px;height:32px;margin-left:-56px;background:#000;border-radius:20px;z-index:9}
.dev-android .punch{left:50%;top:22px;width:14px;height:14px;margin-left:-7px;background:#000;border-radius:50%;z-index:9}
.dev-mini .lbl,.dev-f4 .lbl,.dev-s2 .lbl{color:#8a8c95;font-size:10px;letter-spacing:2px;left:0;right:0;text-align:center}
.dev-mini .lbl{top:8px}.dev-mini .slot{left:22%;right:22%;bottom:16px;height:6px;border-radius:3px;background:#0b0b0d;box-shadow:inset 0 1px 2px #000}
.dev-mini .nfc{right:16px;bottom:28px;color:#6d6f78}
.dev-f4 .printer{left:13px;right:13px;top:14px;height:74px;border-radius:14px;background:#24262c;box-shadow:inset 0 2px 6px #0008}
.dev-f4 .pslot{left:34px;right:34px;top:24px;height:5px;background:#060607;border-radius:3px}
.dev-f4 .paper{left:40px;right:40px;top:26px;height:0;background:repeating-linear-gradient(#fff,#fff 9px,#e9e9e9 10px);transform-origin:bottom;transition:height 1.6s ease-out, top 1.6s ease-out;border-radius:2px 2px 0 0;z-index:3}
.dev-f4.printing .paper{height:120px;top:-94px}
.dev-f4 .lbl{top:58px}.dev-f4 .msr{right:-3px;top:140px;bottom:120px;width:4px;background:#000;border-radius:2px}
.dev-s2 .lbl{bottom:5px}
.dev-s2 .stand{left:50%;bottom:-70px;width:120px;height:70px;margin-left:-60px;background:linear-gradient(#26272d,#1B1C21)}
.dev-s2 .base{left:50%;bottom:-96px;width:330px;height:28px;margin-left:-165px;background:#1B1C21;border-radius:12px 12px 6px 6px;box-shadow:0 14px 24px #02025B30}
.dev-s2 .rdr{right:-58px;top:30%;width:52px;height:150px;background:#1B1C21;border-radius:0 12px 12px 0;color:#7d7f88;display:grid;place-items:center}
.status{height:var(--stat,44px);flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:13px;font-weight:700;background:var(--p,#02025B);color:#fff}
.status .ri{display:flex;gap:5px;align-items:center;font-weight:500;font-size:11px}
.dev-iphone .status{--stat:54px;padding-bottom:8px}.dev-android .status{--stat:44px}
.dev-mini .status,.dev-f4 .status,.dev-s2 .status{--stat:24px;padding:0 10px 3px;font-size:11px}
.homebar{position:absolute;left:50%;bottom:7px;width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#0006;z-index:30;pointer-events:none}
.dev-mini .homebar,.dev-f4 .homebar,.dev-s2 .homebar{display:none}
/* ===== App ===== */
#app{flex:1;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"head" "body" "foot" "tabs";background:var(--bg);color:var(--tx);font-size:15px;position:relative}
#app,#payov,#sheet,.status{--p:#02025B;--a:#005DED;--as:#E1F5FF;--bg:#F1F5FB;--tx:#111122;--mut:#63637F;--ln:#DCE0EB;--ok:#2E7F7E;--bad:#CF2A36;--onp:#fff}
[data-theme=summit]{--p:#1E4D3B!important;--a:#C2571A!important;--as:#F4E7DA!important;--bg:#F6F3EC!important;--tx:#1d2a24!important;--mut:#6b7069!important;--ln:#E2DCCF!important}
[data-theme=summit] .ahead h1,[data-theme=summit] .big{font-family:Georgia,"Times New Roman",serif}
.ahead{grid-area:head;background:var(--p);color:#fff;padding:8px 14px 12px;display:flex;align-items:center;gap:10px;min-width:0}
.ahead h1{margin:0;font-size:18px;font-weight:500;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahead .sub{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahead .tt{flex:1;min-width:0}
.hbtn{background:#ffffff1f;border:0;color:#fff;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.avm{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--p);font-weight:700;font-size:13px;border:0;flex:none}
.cobrand{grid-area:head;display:contents}
.pstrip{background:#C0E7FF;color:#02025B;font-size:12px;padding:5px 14px;display:flex;gap:8px;align-items:center;font-weight:500}
.pstrip button{margin-left:auto;border:0;background:#02025B;color:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px}
.headwrap{grid-area:head;min-width:0}
.abody{grid-area:body;overflow-y:auto;overflow-x:hidden;padding:12px 14px 16px;min-width:0;-webkit-overflow-scrolling:touch}
.afoot{grid-area:foot;padding:10px 14px;background:#fff;border-top:1px solid var(--ln)}
.atabs{grid-area:tabs;display:flex;background:#fff;border-top:1px solid var(--ln);padding:4px 4px calc(6px + var(--safe,0px))}
.atabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--mut);padding:5px 0;position:relative;min-width:0}
.atabs button.on{color:var(--a);font-weight:700}
.atabs .bdg{position:absolute;top:0;left:50%;margin-left:6px;background:var(--a);color:#fff;border-radius:9px;font-size:9.5px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
.dev-iphone .atabs,.bare .atabs{--safe:14px}
.mb{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--a);color:#fff;font-weight:700;padding:13px 18px;width:100%;font-size:15.5px}
.mb.sec{background:#fff;color:var(--p);border:1.5px solid var(--ln);font-weight:500}
.mb.dark{background:var(--p)}.mb.sm{padding:8px 14px;font-size:13.5px;width:auto}.mb.bad{background:#fff;color:var(--bad);border:1.5px solid var(--ln)}
.mb:disabled{opacity:.45}
.brow{display:flex;gap:8px}.brow>*{flex:1}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
.lrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #EEF1F5;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;min-width:0}
.lrow:last-child{border-bottom:0}
.lrow .li{width:38px;height:38px;border-radius:11px;background:var(--as);color:var(--a);display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.lrow .lm{flex:1;min-width:0}.lrow .lm b{display:block;font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .lm span{font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lr{text-align:right;font-weight:500;white-space:nowrap;font-size:14px}
.pl{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:500;background:#EBEFF6;color:#02025B;white-space:nowrap}
.pl.ok{background:#E2F2F1;color:#2E7F7E}.pl.warn{background:#FDEAE2;color:#B4461D}.pl.bad{background:#FBE5E7;color:#CF2A36}.pl.a{background:var(--as);color:var(--a)}
.srch{width:100%;border:1px solid var(--ln);border-radius:999px;padding:10px 16px;background:#fff;font-size:16px;margin-bottom:10px}
.srch:focus,.inp:focus{outline:3px solid #005DED33;border-color:var(--a)}
.inp{width:100%;border:1px solid var(--ln);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:#fff;border-radius:999px;padding:6px 13px;font-size:13px;color:var(--tx);font-weight:500}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.tile{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 11px;text-align:left;min-height:84px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile i{position:absolute;left:0;top:0;bottom:0;width:5px}
.tile b{font-weight:500;font-size:14px;line-height:1.25;color:var(--tx)}.tile span{margin-top:auto;color:var(--mut);font-size:13px}
.tile.out{opacity:.45}.tile .q{position:absolute;right:8px;top:8px;background:var(--a);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11.5px;display:grid;place-items:center;font-weight:700}
.cartbar{display:flex;align-items:center;gap:10px}
.sellwrap{display:block}.cartpane{display:none}
.cl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #EEF1F5;align-items:flex-start}
.cl .cm{flex:1;min-width:0}.cl .cm b{font-weight:500;display:block}.cl .cm span{font-size:12.5px;color:var(--mut);display:block}
.qty{display:flex;align-items:center;gap:2px;flex:none}.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:16px;line-height:1;color:var(--p)}.qty em{font-style:normal;min-width:22px;text-align:center;font-weight:700}
.tot{display:flex;justify-content:space-between;padding:3px 0;font-size:14px;color:var(--mut)}.tot.g{color:var(--tx);font-weight:700;font-size:18px;padding-top:8px;border-top:1px solid var(--ln);margin-top:6px}
.tot .neg{color:var(--ok)}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
.kp div{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 12px}
.kp span{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:block}.kp b{font-size:20px;font-weight:500;color:var(--p)}
.big{font-size:34px;font-weight:400;letter-spacing:-.6px;color:var(--p)}
.mut{color:var(--mut)}.sm{font-size:12.5px}.ctr{text-align:center}
.seg2{display:flex;background:#fff;border:1px solid var(--ln);border-radius:999px;padding:3px;margin-bottom:10px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-weight:500;color:var(--mut);font-size:13.5px}.seg2 button.on{background:var(--p);color:#fff}
.bar{height:8px;border-radius:5px;background:#E7EAF2;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);border-radius:5px}
.hero2{background:linear-gradient(135deg,#1A92FF,#005DED 40%,#02025B);color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}
[data-theme=summit] .hero2{background:linear-gradient(135deg,#2F6B54,#1E4D3B 60%,#12261D)}
.hero2 .big{color:#fff}.hero2 .mut{color:#ffffffc0}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:10px}
.qa button{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--tx);font-weight:500}
.qa button svg{color:var(--a)}
/* sheet */
#sheet{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;background:#02025B66}
#sheet.on{display:flex}
.sh{background:#fff;width:100%;max-height:86%;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + var(--safe,0px));overflow:auto;animation:shup .22s ease-out;color:var(--tx)}
.sh:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#CDD1E2;margin:0 auto 10px}
.sh h2{margin:0 0 10px;font-size:18px;font-weight:500;color:var(--p)}
@keyframes shup{from{transform:translateY(40px);opacity:0}}
#toastm{position:absolute;left:14px;right:14px;top:8px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.tm{background:#02025B;color:#fff;border-radius:12px;padding:10px 14px;font-size:13.5px;box-shadow:0 8px 20px #0003;animation:shup .2s}
#splash{position:absolute;inset:0;z-index:80;background:var(--p,#02025B);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#splash.on{display:flex;animation:fade .25s}@keyframes fade{from{opacity:0}}
#splash .avx{width:70px;height:70px;border-radius:20px;background:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
/* pay overlay */
#payov{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;background:var(--bg);color:var(--tx);font-size:15px}
#payov.on{display:flex}
.pv{flex:1;min-height:0;display:flex;flex-direction:column}
.pvh{background:var(--p);color:#fff;padding:calc(var(--stat,44px) + 4px) 14px 12px;display:flex;align-items:center;gap:10px}
.pvh b{flex:1;font-weight:500;font-size:16px}
.pvb{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.pvb.c{align-items:center;justify-content:center;text-align:center}
.amt{font-size:42px;font-weight:400;letter-spacing:-1px;color:var(--p);line-height:1.1}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.tips button{border:1.5px solid var(--ln);background:#fff;border-radius:14px;padding:14px 4px;font-weight:700;font-size:18px;color:var(--p)}
.tips button span{display:block;font-weight:400;font-size:12.5px;color:var(--mut)}
.meth{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ln);background:#fff;border-radius:14px;padding:13px 14px;width:100%;text-align:left}
.meth .mi{width:42px;height:42px;border-radius:12px;background:var(--as);color:var(--a);display:grid;place-items:center;flex:none}
.meth b{display:block;font-weight:500}.meth span{font-size:12.5px;color:var(--mut)}
.reader{width:150px;height:150px;border-radius:50%;background:var(--as);display:grid;place-items:center;color:var(--a);position:relative;margin:6px auto}
.reader:before,.reader:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--a);opacity:0;animation:pulse 2s infinite}
.reader:after{animation-delay:1s}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.45);opacity:0}}
.sim{width:100%;border-top:1px dashed var(--ln);padding-top:10px;margin-top:auto}
.sim small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.sim .sg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.sim button{border:1px solid var(--ln);background:#fff;border-radius:10px;padding:9px 6px;font-size:13px;color:var(--p);font-weight:500}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--as);border-top-color:var(--a);animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
.okc{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .3s}.okc.bad{background:var(--bad)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.pinp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:280px}
.pinp button{border:1px solid var(--ln);background:#fff;border-radius:12px;padding:12px 0;font-size:19px;font-weight:500;color:var(--p)}
.dots{display:flex;gap:10px;justify-content:center}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--p)}.dots i.f{background:var(--p)}
.scanov{position:absolute;inset:0;z-index:55;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:14px}
.scanov.on{display:flex}
.vf{width:70%;max-width:300px;aspect-ratio:1.5;border:3px solid #fff;border-radius:16px;position:relative;overflow:hidden}
.vf:after{content:"";position:absolute;left:8%;right:8%;height:2px;background:#ff5a3c;top:10%;animation:sweep 1s ease-in-out infinite alternate}
@keyframes sweep{to{top:88%}}
.stk{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:13.5px;align-items:center}
/* wide device (S2Pro) */
@container scr (min-width:700px){
 #app{grid-template-columns:92px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"tabs head" "tabs body" "tabs foot";font-size:16px}
 .atabs{flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:10px 4px;justify-content:flex-start;gap:6px}
 .atabs button{flex:none;padding:10px 0;font-size:11.5px}
 .abody{padding:16px 20px}
 .abody>.narrow{max-width:640px;margin:0 auto}
 .sellwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;height:100%}
 .sellwrap>.cat{overflow:auto;min-height:0}
 .cartpane{display:flex;flex-direction:column;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:12px 14px;min-height:0;overflow:hidden}
 .cartpane>div:nth-child(2){overflow:auto;min-height:0}
 .abody.sellb{overflow:hidden}
 .afoot.cartfoot{display:none}
 .sh{max-width:520px;margin:0 auto;border-radius:20px;margin-bottom:5%}
 #sheet{align-items:center}
 .pv{max-width:520px;width:100%;margin:0 auto;background:var(--bg)}
 #payov{background:#02025Bcc}
 .pvh{padding-top:14px;border-radius:0}
 .pv{margin:24px auto;border-radius:18px;overflow:hidden;flex:1}
 .kp{grid-template-columns:repeat(4,minmax(0,1fr))}
 #toastm{left:auto;right:20px;width:320px;top:40px}
}
@container scr (max-width:340px){
 .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ahead h1{font-size:16px}.abody{padding:10px 10px 14px}.afoot{padding:8px 10px}
 .amt{font-size:34px}.reader{width:110px;height:110px}.pvb{padding:12px;gap:8px}
 .atabs button{font-size:9.5px}.tips button{padding:10px 2px;font-size:16px}
 .pinp button{padding:8px 0}
}
/* ===== Responsive stage ===== */
@media (max-width:1180px){.dmain{grid-template-columns:250px minmax(0,1fr)}.dside.r{display:none}}
@media (max-width:820px){
 .dmain{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 .dside.l{display:none}
 .dtool{display:flex;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
 .dtool select{flex:1;border:1px solid #CDD1E2;border-radius:999px;padding:8px 12px;background:#fff;min-width:0;font-size:16px}
 .dbar .t{display:none}
}
/* Real phone: the app fills the screen, no frame */
body.bare{overflow:hidden;background:#02025B}
.bare .dbar,.bare .dside,.bare .dtool,.bare .dcap,.bare .deco{display:none!important}
.bare .dmain{display:block;height:100dvh}
.bare .dcenter{height:100dvh;display:block;background:none}
.bare #devwrap{width:100%!important;height:100%!important}
.bare .dev{transform:none!important;padding:0;border-radius:0;box-shadow:none;width:100%;height:100%;margin:0}
.bare .screen{width:100%;height:100%;border-radius:0}
.bare .status{display:none}.bare .ahead,.bare .pstrip:first-child{padding-top:calc(8px + env(safe-area-inset-top,0px))}
.bare .pvh{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.bare .homebar{display:none}
.appwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.pvh{padding:12px 14px!important}
.bare .pvh{padding-top:calc(12px + env(safe-area-inset-top,0px))!important}
a.lrow{color:inherit}
.lrow{font-size:inherit}
.dev{width:max-content}
</style></head>

function calc(s=ST()){const c=s.cart,items=sum(c.lines.filter(l=>!l.gc),l=>l.price*l.qty),gcs=sum(c.lines.filter(l=>l.gc),l=>l.price*l.qty);const disc=c.disc?Math.min(items,c.disc.pct?items*c.disc.pct:c.disc.amt):0;const cu0=c.cust&&s.cust.find(x=>x.id===c.cust);const rew=c.redeem&&cu0&&cu0.pts>=s.loy.pts?Math.min(s.loy.off,items-disc):0;const tax=r2((items-disc-rew)*s.tax);return {items,gcs,disc:r2(disc),rew:r2(rew),tax,total:r2(items-disc-rew+tax+gcs),n:sum(c.lines,l=>l.qty),earn:Math.floor(items-disc-rew)}}
const custOf=(s,id)=>s.cust.find(c=>c.id===id);
function pAdd(id){const s=ST(),it=s.items.find(x=>x.id===id);if(it.out){mtoast(`${esc(it.name)} is marked unavailable`);return}if(it.mods.length){sheet(`<h2>${esc(it.name)}</h2>${it.mods.map(m=>`<div class="card" style="padding:10px 12px"><h3>${MODS[m].n}</h3><div class="chips" style="flex-wrap:wrap;overflow:visible;margin:0;padding:0">${MODS[m].o.map(([l,p],i)=>`<button class="chip ${!MODS[m].multi&&i===0?'on':''}" data-g="${m}" data-l="${esc(l)}" data-p="${p}" onclick="pModTap(this,${MODS[m].multi?1:0})">${esc(l)}${p?` +${money(p)}`:''}</button>`).join('')}</div></div>`).join('')}<button class="mb" onclick="pAddMods('${id}')">Add to order</button>`);return}
 const ex=s.cart.lines.find(l=>l.id===id&&!l.mods.length&&!l.gc);if(ex)ex.qty++;else s.cart.lines.push(L(id,it.name,it.price));draw()}
function pModTap(b,multi){if(multi)b.classList.toggle('on');else{$$(`#sheet .chip[data-g="${b.dataset.g}"]`).forEach(x=>x.classList.remove('on'));b.classList.add('on')}}
function pAddMods(id){const s=ST(),it=s.items.find(x=>x.id===id),on=$$('#sheet .chip.on');s.cart.lines.push(L(id,it.name,r2(it.price+sum(on,b=>+b.dataset.p)),1,on.map(b=>b.dataset.l).filter(l=>l!=='First available')));closeSheet();draw()}
function pQty(k,d){const c=ST().cart,l=c.lines.find(x=>x.k===k);l.qty+=d;if(l.qty<=0)c.lines=c.lines.filter(x=>x.k!==k);if(!c.lines.length&&nav().stack.length&&nav().stack[nav().stack.length-1].fn==='pCart'){pop();return}draw()}
function pClear(){const s=ST();s.cart={lines:[],cust:null,disc:null,redeem:false,ticket:null};draw()}
function pGrid(){const s=ST(),q=s.q.toLowerCase(),c=s.cart;const list=s.items.filter(i=>q?i.name.toLowerCase().includes(q):s.cat==='Popular'?i.pop:i.cat===s.cat);return list.map(i=>{const n=sum(c.lines.filter(l=>l.id===i.id),l=>l.qty);return `<button class="tile ${i.out?'out':''}" onclick="pAdd('${i.id}')"><i style="background:${i.col}"></i><b>${esc(i.name)}</b><span>${i.out?'Unavailable':money(i.price)}${i.mods.length?' · options':''}</span>${n?`<em class="q">${n}</em>`:''}</button>`}).join('')||'<div class="mut">No items match</div>'}
function pCartBody(){const s=ST(),c=s.cart,t=calc(s),cu=c.cust&&custOf(s,c.cust);if(!c.lines.length)return `<div class="ctr mut" style="padding:30px 0">${ic('bag',30)}<br>No items yet<br><span class="sm">Tap items to start an order</span></div>`;
 return `${c.ticket?`<div class="pl a" style="margin-bottom:6px">${esc(s.tickets.find(x=>x.id===c.ticket)?.label||'')}</div>`:''}${c.lines.map(l=>`<div class="cl"><div class="cm"><b>${esc(l.name)}</b>${l.mods.length?`<span>${l.mods.map(esc).join(' · ')}</span>`:''}<span>${money(l.price)}${l.gc?' · '+l.code:''}</span></div><div class="qty"><button onclick="pQty('${l.k}',-1)" aria-label="Less">−</button><em>${l.qty}</em>${l.gc?'':`<button onclick="pQty('${l.k}',1)" aria-label="More">+</button>`}</div></div>`).join('')}
 ${lrow(cu?ini(cu.name):ic('user',18),cu?esc(cu.name):'Add customer',cu?`${cu.pts} pts · ${s.loy.name}`:'Look up or enroll for loyalty',cu?`<span class="mut" onclick="event.stopPropagation();ST().cart.cust=null;ST().cart.redeem=false;draw()">Remove</span>`:ic('chev',16),"pPickCust()")}
 ${cu?lrow(ic('star',18),cu.pts>=s.loy.pts?`Redeem ${money0(s.loy.off)} reward`:`${s.loy.pts-cu.pts} pts to next reward`,cu.pts>=s.loy.pts?`Uses ${s.loy.pts} of ${cu.pts} pts`:`Earns ${t.earn} pts on this order`,cu.pts>=s.loy.pts?pl(c.redeem?'Applied':'Apply',c.redeem?'ok':'a'):'',cu.pts>=s.loy.pts?"ST().cart.redeem=!ST().cart.redeem;draw()":''):''}
 ${lrow(ic('percent',18),c.disc?esc(c.disc.n):'Add discount',c.disc?'Tap to change':'',c.disc?`<span class="mut" onclick="event.stopPropagation();ST().cart.disc=null;draw()">Remove</span>`:ic('chev',16),"pDisc()")}
 <div style="margin-top:8px"><div class="tot"><span>Subtotal</span><span>${money(t.items+t.gcs)}</span></div>${t.disc?`<div class="tot"><span>Discount</span><span class="neg">−${money(t.disc)}</span></div>`:''}${t.rew?`<div class="tot"><span>${s.loy.name} reward</span><span class="neg">−${money(t.rew)}</span></div>`:''}<div class="tot"><span>Tax</span><span>${money(t.tax)}</span></div><div class="tot g"><span>Total</span><span>${money(t.total)}</span></div></div>`}
function pCartFoot(){const s=ST(),t=calc(s);return `<div class="brow"><button class="mb sec" style="flex:.8" onclick="pSaveTicket()">${s.cart.ticket?'Update':'Save'}</button><button class="mb" style="flex:1.6" onclick="pCharge()">Charge ${money(t.total)}</button></div>`}
function pPickCust(){CUSTCB=id=>{ST().cart.cust=id;draw()};custSheet()}
let CUSTCB=null;
function custSheet(){sheet(`<h2>Find customer</h2><input class="srch" placeholder="Name or phone" oninput="$('#cres').innerHTML=custRes(this.value)"><div id="cres">${custRes('')}</div><button class="mb sec" style="margin-top:10px" onclick="pNewCust(1)">${ic('plus',17)}New customer</button>`)}
function custRes(q){q=q.toLowerCase();const s=ST();return s.cust.filter(c=>!q||c.name.toLowerCase().includes(q)||c.phone.replace(/\D/g,'').includes(q.replace(/\D/g,'')||'~')).slice(0,6).map(c=>lrow(ini(c.name),esc(c.name),c.phone,`${c.pts} pts`,`closeSheet();CUSTCB('${c.id}')`)).join('')||'<div class="mut sm">No match – enroll a new customer</div>'}
function pNewCust(attach){sheet(`<h2>New customer</h2><input class="inp" id="ncN" placeholder="Full name"><input class="inp" id="ncP" type="tel" placeholder="Mobile number"><input class="inp" id="ncE" type="email" placeholder="Email (optional)"><label class="sm mut" style="display:flex;gap:8px;margin:4px 0 12px"><input type="checkbox" checked> Enroll in ${esc(ST().loy.name)} – 25 bonus points</label><button class="mb" onclick="pSaveCust(${attach?1:0})">Save customer</button>`)}
function pSaveCust(attach){const s=ST(),n=$('#ncN').value.trim();if(!n){mtoast('Enter a name');return}const c={id:uid('c'),name:n,phone:$('#ncP').value.trim()||'(404) 555-0100',email:$('#ncE').value.trim(),pts:25,visits:0,spend:0,fav:'—',last:'Today'};s.cust.unshift(c);closeSheet();logSync(`New customer: ${n}`,`${s.name} · enrolled in ${s.loy.name}`,isP()?'partner/merchants':'smb/customers','Portal › Customers');mtoast(`${esc(n)} enrolled · 25 bonus points`);if(attach){s.cart.cust=c.id}draw()}
function pDisc(){const s=ST();sheet(`<h2>Discount</h2>${s.discs.map((d,i)=>lrow(ic('percent',18),esc(d.n),'',ic('chev',16),`ST().cart.disc=ST().discs[${i}];closeSheet();draw()`)).join('')}`)}
function pSaveTicket(){const s=ST(),c=s.cart;if(!c.lines.length)return;if(c.ticket){const t=s.tickets.find(x=>x.id===c.ticket);t.lines=c.lines;t.cust=c.cust;mtoast(`${esc(t.label)} updated${s.id==='pp'?' · sent to kitchen':''}`);s.cart={lines:[],cust:null,disc:null,redeem:false,ticket:null};nav().stack=[];draw();return}
 const opts=s.id==='pp'?['Table 2','Table 5','Table 9','Table 11','Bar tab','To-go']:s.id==='magnolia'?['Walk-in – next chair','Walk-in – waiting']:['Hold for customer','Layaway'];sheet(`<h2>Save as open ${s.ticketWord.toLowerCase()}</h2><div class="chips" style="flex-wrap:wrap">${opts.map(o=>`<button class="chip" onclick="pMkTicket('${o}')">${o}</button>`).join('')}</div>`)}
function pMkTicket(label){const s=ST(),c=s.cart;s.tickets.unshift({id:uid('t'),label,kind:'open',meta:`${calc(s).n} items · ${s.emp} · just now`,status:'Open',lines:c.lines,cust:c.cust});s.cart={lines:[],cust:null,disc:null,redeem:false,ticket:null};closeSheet();nav().stack=[];mtoast(`${label} saved${s.id==='pp'?' · sent to kitchen':''}`);draw()}
/* ---------- Checkout ---------- */
function pCharge(){const s=ST(),t=calc(s);if(!s.cart.lines.length){mtoast('Add an item first');return}const cu=s.cart.cust&&custOf(s,s.cart.cust);startPay({amount:t.total,tipping:s.tipping&&t.items>0,cash:true,gc:s.gc,customer:cu,merchant:s.name,onDone:res=>pDone(res)})}
function pDone(res){const s=ST(),c=s.cart,t=calc(s),cu=c.cust&&custOf(s,c.cust),id='TX'+ri(9200,9999);let extra='';
 const sold=c.lines.filter(l=>l.gc);sold.forEach(l=>{if(l.reload){const g=s.gc.find(x=>x.code===l.code);g.bal=r2(g.bal+l.price)}else s.gc.unshift({code:l.code,bal:l.price,orig:l.price,owner:cu?cu.name:'Walk-in'})});
 if(sold.length){extra+=`<div class="card" style="margin:0"><h3>Gift cards</h3>${sold.map(l=>`<div class="tot"><span>${l.code} ${l.reload?'reloaded':'activated'}</span><span>${money(l.price)}</span></div>`).join('')}</div>`;logSync(`Gift card ${sold[0].reload?'reloaded':'sold'}: ${sold[0].code}`,`${s.name} · ${money(sum(sold,l=>l.price))}`,isP()?'partner/merchants':'smb/loyalty','Portal › Loyalty & gift cards')}
 if(cu){const before=cu.pts;if(c.redeem&&t.rew)cu.pts-=s.loy.pts;cu.pts+=t.earn;cu.visits++;cu.spend=r2(cu.spend+res.total);cu.last='Today';extra+=`<div class="card" style="margin:0"><h3>${esc(s.loy.name)} · ${esc(cu.name)}</h3>${c.redeem&&t.rew?`<div class="tot"><span>Reward redeemed</span><span>−${s.loy.pts} pts</span></div>`:''}<div class="tot"><span>Points earned</span><span class="neg">+${t.earn} pts</span></div><div class="tot g" style="font-size:15px"><span>New balance</span><span>${cu.pts} pts</span></div></div>`;logSync(`Loyalty: ${cu.name} ${before} → ${cu.pts} pts`,`${s.name} · ${s.loy.name}`,isP()?'partner/merchants':'smb/loyalty','Portal › Loyalty')}
 const tx={id,time:tnow(),lines:c.lines.map(l=>({name:l.name,price:l.price,qty:l.qty,mods:l.mods})),total:r2(res.total-res.tip),tip:res.tip,tenders:res.tenders,cust:cu?cu.name:'',status:'Approved',emp:s.emp,disc:t.disc+t.rew};s.tx.unshift(tx);
 const cashT=res.tenders.find(x=>x.type==='cash');if(cashT)s.shift.cashSales=r2(s.shift.cashSales+cashT.amount);
 if(c.ticket)s.tickets=s.tickets.filter(x=>x.id!==c.ticket);
 const main=res.tenders.find(x=>x.type==='card')||res.tenders[0];logSync(`Sale ${id} · ${money(res.total)}`,`${s.name} · ${res.tenders.map(tenderLabel).join(' + ')}`,isP()?'partner/merchants':'smb/transactions',isP()?'Portal › Partner › Merchants':'Portal › Transactions');
 if(isP())logSync(`Residual accrued +${money(res.total*.0034)}`,`Southeast Payments Group · ${s.name}`,'partner/residuals','Portal › Residuals');
 if(s.id==='pp')saveTx({seg:'smb',id,amount:tx.total,tip:res.tip,method:main.type==='card'?(main.entry==='Apple Pay'?'Apple Pay':main.brand.split(' ')[0]):main.type==='cash'?'Cash':'Gift card',last4:main.last4||'',emp:s.emp.replace(' L.',' Lopez'),type:c.ticket?'Dine-in':'Takeout',items:t.n,cust:cu?cu.name:'',device:D().name});
 s.cart={lines:[],cust:null,disc:null,redeem:false,ticket:null};nav().stack=[];return extra}

function pOrders(){const s=ST(),open=s.tickets.filter(t=>t.kind==='open'),on=s.tickets.filter(t=>t.kind==='online'),tabs=[`${s.id==='pp'?'Tables & tabs':s.id==='magnolia'?'Appointments':'Open orders'} (${open.length})`,`Online (${on.length})`],list=s.otab?on:open;

 <div class="card"><h3>Availability${sel!=='One'?' · size '+sel:''}</h3><div class="stk">${Object.keys(ESTORES).map(k=>`<span>${ESTORES[k]}${k===EN.store?' (this store)':''}</span><b>${p.st[k][sel]}</b>${p.st[k][sel]>0?pl('In stock','ok'):pl('Out','bad')}`).join('')}</div></div>`,
 foot:here>0?`<button class="mb" onclick="eAdd('${sku}','${sel}');pop()">Add to basket</button>`:from?`<button class="mb" onclick="eAdd('${sku}','${sel}','${from}');pop()">${ic('truck',18)}Ship to customer from ${ESTORES[from]}</button><div class="mut sm ctr" style="margin-top:6px">Endless aisle – sell it now, free 2-day delivery</div>`:`<button class="mb" disabled>Unavailable in this size</button>`})};
function eMemSheet(){sheet(`<h2>Summit Rewards member</h2><input class="srch" placeholder="Name, phone or member number" oninput="$('#mres').innerHTML=eMemRes(this.value,1)"><div id="mres">${eMemRes('',1)}</div>`)}
function eMemRes(q,attach){q=q.toLowerCase();return EN.members.filter(m=>!q||m.name.toLowerCase().includes(q)||m.phone.replace(/\D/g,'').includes(q.replace(/\D/g,'')||'~')).slice(0,7).map(m=>lrow(ini(m.name),esc(m.name),`${m.tier} · ${m.phone}`,`${m.pts.toLocaleString()} pts`,attach?`closeSheet();EN.basket.member='${m.id}';draw()`:`push('eMember','${m.id}')`)).join('')||'<div class="mut sm">No member found</div>'}
function ePromo(){sheet(`<h2>Promotions</h2>${EN.promos.map((p,i)=>lrow(ic('percent',18),esc(p.n),'',ic('chev',16),`EN.basket.promo=EN.promos[${i}];closeSheet();draw()`)).join('')}`)}
function ePay(){const b=EN.basket,t=eCalc(),m=b.member&&eM(b.member);startPay({amount:t.total,tipping:false,cash:false,link:true,gc:EN.gc,customer:m,merchant:ESTORES[EN.store],doneLabel:'Next customer',onDone:res=>{const id='S'+ri(77500,77999),pid='pay_'+Math.random().toString(36).slice(2,12);let extra='';
  if(m){if(b.div)m.div=r2(m.div-t.dv);m.pts+=t.earn;m.closet.unshift(...b.lines.filter(l=>!l.gc).map(l=>l.name));extra+=`<div class="card" style="margin:0"><h3>Summit Rewards · ${esc(m.name)}</h3><div class="tot"><span>Points earned (${m.tier} ${TIERX[m.tier]}×)</span><span class="neg">+${t.earn}</span></div><div class="tot g" style="font-size:15px"><span>Balance</span><span>${m.pts.toLocaleString()} pts</span></div></div>`;logSync(`Member ${m.name} +${t.earn} pts`,'Summit Rewards · synced to CRM','','')}
  const ship=b.lines.filter(l=>l.ship);if(ship.length){extra+=`<div class="card" style="margin:0"><h3>Ship to customer</h3>${ship.map(l=>`<div class="tot"><span>${esc(l.name)} · ${l.size}</span><span>from ${ESTORES[l.ship]}</span></div>`).join('')}<div class="mut sm">Order created · tracking texted when it ships</div></div>`}
  b.lines.filter(l=>l.gc).forEach(l=>EN.gc.unshift({code:l.code,bal:l.price,owner:m?m.name:'Gift'}));b.lines.filter(l=>!l.gc&&!l.ship).forEach(l=>{const p=eP(l.sku);p.st[EN.store][l.size]=Math.max(0,p.st[EN.store][l.size]-l.qty)});
  EN.tx.unshift({id,time:tnow(),lines:b.lines.map(l=>({name:l.name,size:l.size,price:l.price,qty:l.qty})),total:res.total,tenders:res.tenders,member:m?m.name:'',status:'Approved',pid});EN.sold+=res.total;EN.team[0][1]+=res.total;EN.team[0][2]++;
  const main=res.tenders.find(x=>x.type==='card'||x.type==='link')||res.tenders[0];EN.api.unshift({m:'POST /v1/payments',code:201,ms:ri(280,460),id:pid},{m:'POST /v1/tokens',code:201,ms:ri(90,140),id:'tok_'+pid.slice(4,10)});
  extra+=`<div class="card" style="margin:0"><h3>Elavon Payment Gateway</h3><div class="tot"><span>Payment</span><span>${pid}</span></div><div class="tot"><span>Store · MID</span><span>${ESTORES[EN.store]} · 8•••${ri(1000,9999)}</span></div><div class="tot"><span>Card token</span><span>saved to member</span></div></div>`;
  logSync(`Summit sale ${id} · ${money(res.total)}`,`${ESTORES[EN.store]} · ${res.tenders.map(tenderLabel).join(' + ')}`,'ent/transactions','Portal › Enterprise › Transactions');
  saveTx({seg:'ent',id:pid,amount:res.total,brand:main.brand||'Visa',last4:main.last4||'0000',entry:main.type==='link'?'Keyed':main.entry&&/wallet|Apple/.test(main.entry)?'Apple Pay':/Chip/.test(main.entry||'')?'EMV chip':'Contactless',channel:main.type==='link'?'Pay-by-link':'Card-present',city:ESTORES[EN.store].split(' ')[0]});
  EN.basket={lines:[],member:null,promo:null,div:false};return extra}})}
function eMembers(){return view({head:eHead('Members',{sub:'Summit Rewards · clienteling'}),body:`<input class="srch" placeholder="Name, phone or member number" oninput="$('#ml').innerHTML=eMemRes(this.value,0)"><div class="card" id="ml">${eMemRes('',0)}</div>`})}
PAGES.eMember=id=>{const m=eM(id);return view({tabs:false,head:eHead(esc(m.name),{back:true,sub:`${m.tier} member since ${m.since}`}),body:`<div class="hero2"><div class="mut sm">Summit Rewards · ${m.tier}</div><div class="big">${m.pts.toLocaleString()} pts</div><div class="mut sm">Earns ${TIERX[m.tier]}× points · dividend available ${money(m.div)}</div></div><div class="card"><h3>Contact</h3>${lrow(ic('phone',18),m.phone,'Mobile – texts on')}${lrow(ic('mail',18),esc(m.email),'eReceipts on')}${lrow(ic('card',18),'Visa ••4821','Tokenized card on file')}</div><div class="card"><h3>Gear closet</h3>${m.closet.slice(0,5).map(n=>lrow(ic('tag',18),esc(n),'Purchased','')).join('')}</div><div class="card"><h3>Suggested next</h3>${lrow(ic('bulb',18),'Rain Shell','Pairs with recent purchases',money(149),"push('eProd','RS-1188')")}</div>`,foot:`<button class="mb" onclick="EN.basket.member='${id}';nav().tab='sale';nav().stack=[];draw()">Start sale for ${esc(m.name.split(' ')[0])}</button>`})};
function eOrders(){const pk=EN.pickups;return view({head:eHead('Orders',{sub:ESTORES[EN.store]}),body:`<div class="seg2"><button class="${EN.otab?'':'on'}" onclick="EN.otab=0;draw()">Pickups (${pk.filter(p=>p.status==='Ready').length})</button><button class="${EN.otab?'on':''}" onclick="EN.otab=1;draw()">Returns</button></div>${EN.otab?`<div class="card"><h3>Find the receipt</h3><button class="mb sec" onclick="mtoast('Scan the barcode on the receipt or eReceipt')">${ic('scan',18)}Scan receipt</button><div style="height:8px"></div>${EN.tx.map(t=>lrow(ic('receipt',18),`${t.id}${t.member?' · '+esc(t.member):''}`,`${t.time} · ${t.lines.length} item${t.lines.length>1?'s':''}`,`${money(t.total)}${t.status!=='Approved'?'<br>'+stPill(t.status):''}`,`push('eReturn','${t.id}')`)).join('')}</div>`:`<div class="card">${pk.map(p=>lrow(ic('box',18),`${p.id} · ${esc(eM(p.member).name)}`,`${p.placed} · bin ${p.bin}`,stPill(p.status),`push('ePickup','${p.id}')`)).join('')}</div>`}`})}
PAGES.ePickup=id=>{const p=EN.pickups.find(x=>x.id===id),m=eM(p.member);return view({tabs:false,head:eHead(p.id,{back:true,sub:`Pickup for ${esc(m.name)}`}),body:`<div class="card"><h3>Items · bin ${p.bin} ${stPill(p.status)}</h3>${p.items.map(([n,z,pr])=>`<div class="cl"><div class="cm"><b>${esc(n)}</b><span>${z!=='One'?'Size '+z+' · ':''}paid online</span></div><div>${money(pr)}</div></div>`).join('')}</div><div class="card"><h3>Customer</h3>${lrow(ini(m.name),esc(m.name),`${m.tier} · ${m.phone}`,'')}<div class="mut sm">Paid online through the Elavon Payment Gateway. Check photo ID or the pickup code before handing off.</div></div>`,foot:p.status==='Ready'?`<button class="mb" onclick="ePickDone('${id}')">${ic('check',18)}ID verified – hand off</button>`:'<div class="mut ctr">Picked up</div>'})};
function ePickDone(id){const p=EN.pickups.find(x=>x.id===id);p.status='Picked up';mtoast('Pickup complete · customer notified');logSync(`Pickup ${id} handed off`,`${ESTORES[EN.store]} · capture confirmed`,'ent/transactions','Portal › Enterprise › Transactions');pop()}
PAGES.eReturn=id=>{const t=EN.tx.find(x=>x.id===id);t.ret=t.ret||t.lines.map(()=>false);const amt=r2(sum(t.lines.filter((l,i)=>t.ret[i]),l=>l.price*l.qty)*1.06);return view({tabs:false,head:eHead('Return · '+t.id,{back:true,sub:`${t.time}${t.member?' · '+esc(t.member):''}`}),body:`<div class="card"><h3>Select items to return</h3>${t.lines.map((l,i)=>lrow(t.ret[i]?ic('check',18):'',esc(l.name),`${l.size&&l.size!=='One'?'Size '+l.size+' · ':''}${money(l.price)}`,t.ret[i]?pl('Returning','a'):'',`EN.tx.find(x=>x.id==='${id}').ret[${i}]=!${t.ret[i]};draw()`)).join('')}</div><div class="card"><h3>Reason</h3><div class="chips" style="flex-wrap:wrap;overflow:visible">${['Wrong size','Changed mind','Defective','Gift return'].map((r,i)=>`<button class="chip ${i?'':'on'}" onclick="$$('.abody .chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${r}</button>`).join('')}</div></div><div class="card"><h3>Refund to</h3><div class="tot"><span>${esc(tenderLabel(t.tenders[0]))}</span><span>${money(amt)}</span></div><div class="mut sm">Refund goes to the original card by token – no card needed.</div></div>`,foot:t.status==='Approved'?`<button class="mb" ${amt?'':'disabled'} onclick="eRefund('${id}',${amt})">Refund ${money(amt)}</button>`:'<div class="mut ctr">Already refunded</div>'})};
function eRefund(id,amt){const t=EN.tx.find(x=>x.id===id);t.status=amt>=t.total-0.01?'Refunded':'Partial refund';EN.api.unshift({m:'POST /v1/refunds',code:201,ms:ri(180,300),id:'ref_'+uid('')});mtoast(`Refunded ${money(amt)} to the original card`);logSync(`Return ${id} · ${money(amt)} refunded`,`${ESTORES[EN.store]} · POST /v1/refunds`,'ent/transactions','Portal › Enterprise › Transactions');pop()}
PAGES.eFind=()=>view({tabs:false,head:eHead('Find stock',{back:true,sub:'This store, nearby stores and the DC'}),body:`<input class="srch" placeholder="Search product or SKU" oninput="const q=this.value.toLowerCase();$('#fl').innerHTML=eFindList(q)"><div class="card" id="fl">${eFindList('')}</div>`});
function eFindList(q){return EN.prods.filter(p=>!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)).map(p=>{const n=sum(Object.values(p.st[EN.store]));return lrow(ic('tag',18),esc(p.name),p.sku,n?pl(n+' here','ok'):pl('Other stores','warn'),`push('eProd','${p.sku}')`)}).join('')}
PAGES.eGift=()=>view({tabs:false,head:eHead('Gift cards',{back:true}),body:`<div class="card"><h3>Sell a Summit gift card</h3><div class="tips">${[25,50,100].map(v=>`<button onclick="eSellGC(${v})">$${v}</button>`).join('')}</div></div><div class="card"><h3>Check a balance</h3><input class="srch" placeholder="Scan or enter card number" oninput="const q=this.value.toUpperCase();$('#egl').innerHTML=EN.gc.filter(g=>g.code.includes(q)).map(g=>lrow(ic('gift',18),g.code,esc(g.owner),money(g.bal))).join('')"><div id="egl">${EN.gc.map(g=>lrow(ic('gift',18),g.code,esc(g.owner),money(g.bal))).join('')}</div></div>`});
function eSellGC(v){EN.basket.lines.push({k:uid(),sku:'GC',name:'Summit gift card $'+v,size:'One',price:v,qty:1,gc:true,code:'SUM-'+ri(100000,999999)});nav().tab='sale';nav().stack=[];mtoast('Gift card added to basket');draw()}
function eStore(){const mx=Math.max(...EN.depts.map(d=>d[1]));return view({head:eHead('Store',{sub:`${ESTORES[EN.store]} · Atlanta Metro district`}),body:`<div class="card"><h3>Store</h3>${lrow(ic('store',18),ESTORES[EN.store],'Southeast › Atlanta Metro',pl('Change','a'),'eStoreSheet()')}</div><div class="kp"><div><span>Sales today</span><b>${money0(EN.sold)}</b></div><div><span>Transactions</span><b>${214+EN.tx.length}</b></div><div><span>Avg basket</span><b>${money0(EN.sold/(214+EN.tx.length))}</b></div><div><span>Member share</span><b>62%</b></div></div>
 <div class="card"><h3>Sales by department</h3>${EN.depts.map(([d,v])=>`<div style="margin:7px 0"><div class="tot" style="padding:0 0 3px"><span>${d}</span><span>${money0(v)}</span></div><div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join('')}</div>
 <div class="card"><h3>Team today</h3>${EN.team.map(([n,v,c],i)=>lrow(i+1,n,`${c} sales`,money0(v))).join('')}</div>
 <div class="card"><h3>Elavon integration</h3>${lrow(ic('code',18),'Elavon Payment Gateway','SDK 4.2 · production · tokenization on',stPill('Online'))}${EN.api.slice(0,4).map(a=>`<div class="tot"><span style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${a.m}</span><span>${a.code} · ${a.ms} ms</span></div>`).join('')||'<div class="mut sm">API calls from this device appear here after a sale or refund.</div>'}</div>
 <div class="card"><h3>Back office · Elavon One Portal</h3>${[['Enterprise dashboard','ent/dashboard'],['Transactions','ent/transactions'],['Regions & locations','ent/locations'],['Integrations & APIs','ent/integrations']].map(([l,h])=>`<a class="lrow" href="${portalUrl(h)}" target="_blank" rel="noopener"><span class="li">${ic('ext',17)}</span><span class="lm"><b>${l}</b><span>Opens the portal</span></span></a>`).join('')}</div><button class="mb sec" onclick="expSheet()">${ic('swap',17)}Switch experience</button>`})}
function eStoreSheet(){sheet(`<h2>Choose store</h2><div class="mut sm" style="margin:-4px 0 8px">Southeast region › Atlanta Metro district</div>${['mar','alp','atl','ath'].map(k=>lrow(ic('store',18),ESTORES[k],k===EN.store?'Current store':'Atlanta Metro',k===EN.store?pl('Current','a'):'',`EN.store='${k}';closeSheet();mtoast('Now working at ${ESTORES[k]}');draw()`)).join('')}`)}
TABS.ent={home:eHome,sale:eSale,members:eMembers,orders:eOrders,store:eStore};

/* ===== Partner (reseller): portfolio hub + the same front office its merchants run ===== */
const PTM={resid:48210,merch:36,term:118,pending:[{n:'Abbys Estates',c:'Savannah, GA',d:'S1F4 Pro × 2'},{n:'Taxi 2151 Vehicule 1',c:'Montréal, QC',d:'S1 Mini2 × 1'},{n:'Marche Hathai SENC',c:'Laval, QC',d:'S2Pro i16 × 1'}],apps:[]};
const PMER=[['pp','Castles S2Pro i16 + S1F4 Pro'],['berlin','Castles S1 Mini2 + Tap to Pay'],['magnolia','Castles S1F4 Pro'],['thread','Castles S2Pro i16']];
TABDEF.partner=()=>{const s=ST();return [{id:'hub',label:'Partner',icon:'brief'},{id:'sell',label:'Sell',icon:'grid'},{id:'orders',label:'Orders',icon:'list',badge:s.tickets.filter(t=>t.status==='New').length||''},{id:'cust',label:'Customers',icon:'users'},{id:'more',label:'More',icon:'sliders'}]};
function ptOpen(id){A.pm=id;nav().tab='sell';nav().stack=[];mtoast(`Front office: ${esc(STORES[id].name)}`);draw()}
function ptHub(){const today=sum(PMER,([id])=>sum(STORES[id].tx.filter(t=>t.status!=='Refunded'),t=>t.total));return view({head:head('Southeast Payments Group',{sub:'Partner hub · Elavon reseller'}),
 body:`<div class="hero2"><div class="mut sm">Residuals month to date</div><div class="big">${money0(PTM.resid+today*.0034)}</div><div class="mut sm">${PTM.merch+PTM.apps.length} merchants · ${PTM.term} terminals online</div></div>
 <div class="kp"><div><span>Pending activation</span><b>${PTM.pending.length}</b></div><div><span>In underwriting</span><b>${2+PTM.apps.length}</b></div></div>
 <div class="card"><h3>Run a merchant’s front office</h3><div class="mut sm" style="margin-bottom:4px">The same Elavon POS your merchants use – for demos, training and support.</div>${PMER.map(([id,dev])=>{const s=STORES[id];return lrow(ini(s.name),esc(s.name),`${s.kind} · ${dev}`,id===A.pm?pl('Open','a'):ic('chev',16),`ptOpen('${id}')`)}).join('')}</div>
 <div class="card"><h3>Pending activation</h3>${PTM.pending.map((p,i)=>lrow(ic('device',18),esc(p.n),`${p.c} · ${p.d}`,`<span class="pl a" onclick="event.stopPropagation();ptActivate(${i})">Activate</span>`)).join('')||'<div class="mut sm">All terminals are active</div>'}</div>
 <button class="mb" style="margin-bottom:10px" onclick="ptBoard()">${ic('plus',18)}Board a new merchant</button>
 ${PTM.apps.length?`<div class="card"><h3>Applications sent today</h3>${PTM.apps.map(a=>lrow(ic('file',18),esc(a.n),`${a.v} · e-sign link sent`,stPill('Pending'))).join('')}</div>`:''}
 <div class="card"><h3>Back office · Elavon One Portal</h3>${[['Partner dashboard','partner/dashboard'],['Merchants','partner/merchants'],['Boarding','partner/boarding'],['Terminals & jobs','partner/terminals'],['Residuals','partner/residuals']].map(([l,h])=>`<a class="lrow" href="${portalUrl(h)}" target="_blank" rel="noopener"><span class="li">${ic('ext',17)}</span><span class="lm"><b>${l}</b><span>Opens the portal</span></span></a>`).join('')}</div><button class="mb sec" onclick="expSheet()">${ic('swap',17)}Switch experience</button>`})}
function ptActivate(i){const p=PTM.pending.splice(i,1)[0];PTM.term+=1;mtoast(`${esc(p.n)} activated · keys injected`);logSync(`Terminal activated: ${p.n}`,`${p.d} · ${p.c}`,'partner/terminals','Portal › Terminals & jobs');draw()}
function ptBoard(){sheet(`<h2>Board a merchant</h2><input class="inp" id="bN" placeholder="Business name (DBA)"><select class="inp" id="bV"><option>Restaurant</option><option>Coffee shop</option><option>Retail</option><option>Salon & spa</option><option>Services</option></select><input class="inp" id="bM" type="tel" placeholder="Owner mobile"><select class="inp" id="bD"><option>Castles S1F4 Pro</option><option>Castles S1 Mini2</option><option>Castles S2Pro i16</option><option>Tap to Pay on iPhone / Android only</option></select><button class="mb" onclick="ptBoardGo()">Send application to sign</button><p class="mut sm ctr" style="margin:8px 0 0">The owner finishes the secure application on their own phone.</p>`)}
function ptBoardGo(){const n=$('#bN').value.trim();if(!n){mtoast('Enter the business name');return}const a={n,v:$('#bV').value,d:$('#bD').value};PTM.apps.unshift(a);closeSheet();mtoast(`Application texted to the owner of ${esc(n)}`);logSync(`New application: ${n}`,`${a.v} · ${a.d}`,'partner/boarding','Portal › Boarding');draw()}
TABS.partner={hub:ptHub,sell:pSell,orders:pOrders,cust:pCust,more:pMore};
