<style>:root{--navy:#0B2147;--navy2:#13306A;--side:#0E1525;--side2:#1A2338;--bg:#F3F5F9;--card:#fff;--line:#E3E7EF;--txt:#1B2433;--mut:#667085;--accent:#1F5FD6;--accent-soft:#E8F0FF;--ok:#12805C;--ok-s:#E3F6EE;--warn:#B76E00;--warn-s:#FFF3DC;--bad:#C2304B;--bad-s:#FDE8EC;--info:#3657C9;--info-s:#E9EEFF;--r:10px}
body[data-view=smb]{--accent:#0E8A74;--accent-soft:#E2F5F0;--vb:#0E8A74}
body[data-view=ent]{--accent:#3B4FD1;--accent-soft:#E9ECFF;--vb:#3B4FD1}
body[data-view=partner]{--accent:#C25A12;--accent-soft:#FDEEE2;--vb:#C25A12}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
.top{height:58px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand .mark{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center}
.brand .wm{font-weight:700;font-size:20px;letter-spacing:.5px}.brand .sub{font-size:12px;opacity:.75;border-left:1px solid #ffffff40;padding-left:10px;text-transform:uppercase;letter-spacing:1.4px}
.vswitch{display:flex;background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:3px;margin-left:12px}
.vswitch button{border:0;background:transparent;color:#ffffffc8;padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.vswitch button.on{background:#fff;color:var(--navy)}
.vswitch button .d{width:8px;height:8px;border-radius:50%}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{background:transparent;border:0;color:#fff;cursor:pointer;position:relative;padding:6px;border-radius:8px;display:grid;place-items:center}.icon-btn:hover{background:#ffffff1a}
.icon-btn .dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:#E5547A;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.uname{font-weight:600}.vsep{width:1px;height:22px;background:#ffffff40}
.org-btn{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#fff;cursor:pointer;padding:4px 6px;border-radius:8px;font-weight:600;letter-spacing:.3px}.org-btn:hover{background:#ffffff1a}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.top .av{background:#fff;color:var(--navy)}
.ctxbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 22px;position:sticky;top:58px;z-index:20;flex-wrap:wrap}
.vbadge{background:var(--vb);color:#fff;font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.ctxbar .crumb{color:var(--mut)}.ctxbar .crumb b{color:var(--txt)}
.ctxbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.imp{background:#FFF3DC;border:1px solid #F2C46D;color:#7A4A00;border-radius:8px;padding:4px 10px;font-size:13px;display:flex;gap:10px;align-items:center}
.layout{display:flex;min-height:calc(100vh - 101px)}
.side{width:236px;flex:none;background:var(--side);color:#C9D1E1;padding:14px 0;position:sticky;top:101px;height:calc(100vh - 101px);overflow:auto}
.side .grp{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#7D89A3;padding:14px 22px 6px}
.side a.nv{display:flex;align-items:center;gap:12px;padding:9px 22px;color:#D6DCE8;font-weight:500;border-left:3px solid transparent;text-decoration:none}
.side a.nv:hover{background:var(--side2);color:#fff}
.side a.nv.on{background:var(--side2);color:#fff;border-left-color:var(--accent)}
.side a.nv.on svg{color:var(--accent)}
.side .nv .cnt{margin-left:auto;background:#ffffff1c;border-radius:999px;font-size:11px;padding:1px 8px}
.side .modesw{margin:4px 16px 8px;display:flex;background:#ffffff10;border-radius:8px;padding:3px}
.side .modesw button{flex:1;border:0;background:transparent;color:#C9D1E1;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.side .modesw button.on{background:var(--accent);color:#fff}
.side .foot{font-size:11px;color:#6B7690;padding:18px 22px}
main{flex:1;min-width:0;padding:22px 26px 60px}
.ph{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:24px;margin:0;font-weight:650;letter-spacing:-.2px}.ph .desc{color:var(--mut);margin-top:2px}
.ph .act{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#C5CCDA;background:#FAFBFD}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12px}.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:500;font-size:13px}
.card.flush{padding:0}.card.flush h3{padding:16px 18px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.kpi{padding:14px 18px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpi .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi .v{font-size:24px;font-weight:650;margin-top:4px;letter-spacing:-.3px}
.kpi .d{font-size:12px;margin-top:2px;color:var(--mut)}.up{color:var(--ok)!important}.dn{color:var(--bad)!important}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13px;letter-spacing:.5px;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--mut);font-weight:600}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.sel,.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.inp:focus,.sel:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#EEF1F6;color:#475467;white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.warn{background:var(--warn-s);color:var(--warn)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.info{background:var(--info-s);color:var(--info)}.pill.vio{background:#F1EAFE;color:#6B3FCF}
.tbl-tools{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbl-tools .inp{width:240px}
.tbl-tools .sp{flex:1}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);font-weight:650;padding:9px 14px;border-bottom:1px solid var(--line);background:#FAFBFD;white-space:nowrap;cursor:pointer;user-select:none}
th.n,td.n{text-align:right}
td{padding:10px 14px;border-bottom:1px solid #EEF1F5;vertical-align:middle}
tr:hover td{background:#FAFBFE}
.tbl-foot{display:flex;align-items:center;gap:8px;padding:10px 16px;color:var(--mut);font-size:13px}
.tbl-foot .sp{flex:1}
.empty{padding:28px;text-align:center;color:var(--mut)}
.list .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF1F5}.list .row:last-child{border-bottom:0}
.list .row .m{color:var(--mut);font-size:12px}
.list .row .rt{margin-left:auto;text-align:right}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0}.hb .lb{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;height:10px;background:#EEF1F6;border-radius:6px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hb .vl{width:92px;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;display:block;overflow:visible}svg.chart text{font-size:11px;fill:#8A94A6}
svg.chart .bar:hover{opacity:.8}
.insight{display:flex;gap:12px;padding:12px;border-radius:8px;background:var(--accent-soft);margin-bottom:10px;align-items:flex-start}
.insight .ico{color:var(--accent);flex:none;margin-top:1px}.insight b{display:block}.insight .m{color:#475467;font-size:13px}
.menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px #0b214733;z-index:60;width:380px;max-height:78vh;overflow:auto}
.menu.hidden{display:none}
.menu .mh{display:flex;gap:14px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.menu .sec{font-size:11px;letter-spacing:1.3px;color:var(--mut);font-weight:700;padding:14px 20px 6px;text-transform:uppercase}
.menu .it{display:flex;gap:12px;align-items:center;padding:9px 20px;cursor:pointer}.menu .it:hover{background:#F4F6FA}.menu .it.on{background:var(--accent-soft)}
.menu .it .t{font-weight:600;color:var(--accent)}.menu .it .s{font-size:12px;color:var(--mut)}
.menu .mf{display:flex;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:#0B214766;z-index:80;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:14px;width:560px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #0003}
.modal.wide{width:860px}
.modal .mhd{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:650;font-size:16px;display:flex;align-items:center}
.modal .mhd button{margin-left:auto}
.modal .mbd{padding:18px 20px;overflow:auto}
.modal .mft{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}.fg .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#475467}
label.f .inp,label.f .sel,label.f textarea{font-weight:400;font-size:14px;color:var(--txt)}
textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
.tg{position:relative;width:38px;height:22px;flex:none;display:inline-block}.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;background:#CBD2DE;border-radius:999px;cursor:pointer;transition:.15s}
.tg span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.tg input:checked+span{background:var(--accent)}.tg input:checked+span:before{transform:translateX(16px)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1F5}.setrow:last-child{border:0}.setrow .m{color:var(--mut);font-size:12px}.setrow .tg,.setrow .sel{margin-left:auto}
#toasts{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:#13213C;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:0 8px 24px #0004;font-size:13px;display:flex;gap:10px;align-items:center;animation:tin .2s}
.toast i{width:8px;height:8px;border-radius:50%;background:#3DDC97}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kan .col{background:#EBEEF4;border-radius:10px;padding:10px;min-height:200px}
.kan .col h4{margin:2px 4px 10px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#475467;display:flex}.kan .col h4 span{margin-left:auto}
.kc{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);font-size:13px}
.kc b{display:block}.kc .m{color:var(--mut);font-size:12px}.kc .a{margin-top:8px;display:flex;gap:6px}
.floor{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tbl-t{border-radius:12px;padding:12px;text-align:center;cursor:pointer;border:2px solid transparent;user-select:none}
.tbl-t b{font-size:18px;display:block}.tbl-t .m{font-size:11px}
.tbl-t.open{background:#EEF1F6;color:#475467}.tbl-t.seated{background:var(--ok-s);color:var(--ok)}.tbl-t.check{background:var(--warn-s);color:var(--warn)}.tbl-t.dirty{background:var(--bad-s);color:var(--bad)}
.tbl-t.round{border-radius:50%;aspect-ratio:1;display:grid;place-content:center}
.tree{font-size:13.5px}.tree .nd{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer}.tree .nd:hover{background:#F1F4F9}.tree .nd.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.tree .tw{width:16px;color:var(--mut);text-align:center;flex:none}.tree .ch{margin-left:16px}.tree .ct{margin-left:auto;font-size:11px;color:var(--mut)}
.code{background:#0F1726;color:#C8D3E6;border-radius:8px;padding:12px 14px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto;max-height:340px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.appcard{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s}.appcard:hover{border-color:var(--accent);box-shadow:0 4px 16px #0b21470f}
.appic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.steps{display:flex;gap:0;margin-bottom:18px}.steps div{flex:1;text-align:center;font-size:12px;color:var(--mut);padding-top:28px;position:relative;font-weight:600}
.steps div:before{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:#E3E7EF;color:#475467;display:grid;place-items:center;font-size:12px;z-index:1}

/* ===== Elavon brand layer (Elavon product brand guidelines v1.3) ===== */
:root{
 --elavon:#02025B;--bright:#005DED;--lgray:#EBEFF6;--gray10:#F1F5FB;--gray3:#CDD1E2;--gray5:#999EB6;--gray7:#63637F;--lblue:#E1F5FF;--mblue:#C0E7FF;--blue4:#1A92FF;--red1:#FFBEB4;
 --navy:#02025B;--navy2:#02025B;--side:#FFFFFF;--side2:#E1F5FF;--bg:#EBEFF6;--card:#fff;--line:#DCE0EB;--txt:#111122;--mut:#63637F;
 --accent:#005DED;--accent-soft:#E1F5FF;
 --ok:#2E7F7E;--ok-s:#E2F2F1;--warn:#B4461D;--warn-s:#FDEAE2;--bad:#CF2A36;--bad-s:#FBE5E7;--info:#005DED;--info-s:#E1F5FF;--r:12px}

/* Context bar */

.layout{min-height:calc(100vh - 108px)}

/* Type hierarchy: sentence case, Regular for display, Bold for body heads */

a{color:var(--bright)}

tr:hover td{background:#F7F9FD}

/* Callouts use the secondary palette */

.hb .tr{background:var(--lgray)}.hb .tr i{background:var(--bright)}

.code{background:var(--elavon);color:#DCE9FF}

.menu{border-radius:14px;box-shadow:0 16px 48px #02025B33}
.menu .it .t{color:var(--bright);font-weight:500}.menu .it.on{background:var(--lblue)}
.menu .sec{color:var(--gray7)}
.modal .mhd{color:var(--elavon);font-weight:500;font-size:18px}
.overlay{background:#02025B80}
.kan .col{background:var(--gray10);border:1px solid var(--line)}

.tbl-t.open{background:var(--lgray);color:var(--elavon)}.tbl-t.seated{background:var(--bright);color:#fff}.tbl-t.check{background:var(--mblue);color:var(--elavon)}.tbl-t.dirty{background:#FDEAE2;color:var(--warn)}
.tree .nd.on{background:var(--lblue);color:var(--bright)}
.steps div.on:before,.steps div.done:before{background:var(--bright)}
.sched .sh{background:var(--lblue);color:var(--elavon)}
.prog i{background:var(--bright)}
.stat-sm .v{color:var(--elavon);font-weight:400}
.appic{border-radius:14px}
.appcard:hover{border-color:var(--bright)}
/* ===== Brand heroes ===== */

 .rangebar .sp{display:none}
 .rangebar .seg{flex:1 1 100%;display:flex}
 .rangebar .seg button.on{flex:1;min-width:0!important}
}
.proto-note{margin-top:28px;padding:12px 16px;border:1px dashed var(--gray3);border-radius:10px;color:var(--gray7);font-size:12.5px;text-align:center;background:#fff}
/* ===== Geographic map ===== */
.gwrap{display:flex;flex-direction:column;gap:12px}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gbar .sp{flex:1}
.gcrumb{display:flex;align-items:center;gap:6px;color:var(--elavon);font-size:14px;flex-wrap:wrap}
.gcrumb svg{color:var(--bright)}
.gcrumb b{font-weight:700}
.gsep{color:var(--gray5)}
.gseg button[disabled]{opacity:.35;cursor:not-allowed}
.gbody{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.gmapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#EEF3FA}
svg.gmap{display:block;width:100%;height:auto;user-select:none}
.gst{transition:fill .2s}
.gst.clk{cursor:pointer}.gst.clk:hover{filter:brightness(.94)}
.gsl{fill:#4B4F6B;font-weight:500;pointer-events:none;paint-order:stroke;stroke:#ffffffc0;stroke-linejoin:round}
.gm{cursor:pointer;outline:none}
.gm circle{transition:r .15s}
.gm:hover>circle:first-of-type,.gm:focus>circle:first-of-type{stroke:#02025B;stroke-width:3px}
.gm.faded{opacity:.55}.gm.faded:hover{opacity:1}
.gml{fill:#02025B;font-weight:700;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.gms{fill:#33334D;font-weight:500;paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.gmc{font-weight:700;pointer-events:none}
.ghint{position:absolute;left:10px;bottom:10px;background:#ffffffe6;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--gray7)}
.gempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#EEF3FAd9;color:var(--elavon);text-align:center;padding:20px}
.gempty svg{color:var(--bright)}.gempty span{color:var(--gray7);font-size:13px}
.glist{border:1px solid var(--line);border-radius:12px;max-height:420px;overflow:auto;background:#fff}
.glh{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;color:var(--gray7);padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.gli{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #EEF1F5;color:var(--txt);text-decoration:none!important;cursor:pointer}
.gli:hover{background:var(--gray10)}.gli.on{background:var(--lblue)}
.gli i{width:10px;height:10px;border-radius:50%;flex:none}
.gln{display:flex;flex-direction:column;min-width:0;flex:1}.gln b{color:var(--elavon);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glv{font-weight:500;color:var(--elavon);white-space:nowrap}
@media (max-width:1279px){.gbody{grid-template-columns:minmax(0,1fr) 240px}}
@media (max-width:900px){.gbody{grid-template-columns:minmax(0,1fr)}.glist{max-height:260px}}
@media (max-width:700px){.gbar .gby{display:none}.gbar .gseg{flex:1 1 100%;display:grid;grid-template-columns:repeat(4,1fr)}.gbar .gseg button{padding:7px 4px;font-size:12.5px}.gbar>.btn{margin-left:auto}.gcrumb{flex:1 1 100%;font-size:13px}.ghint{font-size:11px;left:6px;bottom:6px;padding:3px 9px}}
.glabels{pointer-events:none}

.mob-btn{display:flex;gap:6px;align-items:center;color:#fff;border:1px solid #ffffff55;border-radius:999px;padding:6px 13px;font-weight:500;font-size:13px;text-decoration:none!important;white-space:nowrap}.mob-btn:hover{background:#ffffff1a}
@media (max-width:1400px){.mob-btn span{display:none}.mob-btn{padding:7px 8px}}
</style></head>

// Elavon full-color data palette, in brand order
const PAL=['#005DED','#02025B','#73BCBA','#999EB6','#3A9695','#FCB749','#EA6334','#CDD1E2'];
const AVC=['#005DED','#02025B','#3A9695','#001E79','#1A92FF','#63637F'];
const PILLMAP={ok:['active','approved','deposited','online','completed','paid','live','won','received','published','activated','healthy','enabled','delivered','succeeded','ready','closed - won','picked up','confirmed','in stock','clocked in','200'],warn:['pending','in transit','pending onboarding','pending activation','in review','draft','low stock','underwriting','needs response','in kitchen','sent','scheduled','processing','degraded','seated','waitlist','partial','at risk','sandbox','queued','running'],bad:['declined','refunded','voided','offline','failed','lost','out of stock','chargeback','overdue','rejected','high risk','suspended','closed - lost','error','4xx','5xx','no-show'],info:['new','in progress','beta','submitted','shipped','open','approved - ship']};
function pill(t,cls){if(!cls){const l=String(t).toLowerCase();cls=Object.keys(PILLMAP).find(k=>PILLMAP[k].includes(l))||''}return `<span class="pill ${cls}">${esc(t)}</span>`}
const kpi=(l,v,d,up)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${d!=null?`<div class="d ${up===true?'up':up===false?'dn':''}">${d}</div>`:''}</div>`;
const kpis=a=>`<div class="kpis">${a.map(x=>kpi(...x)).join('')}</div>`;
const delta=(v,good=true)=>{const u=v>=0;return [`${u?'▲':'▼'} ${Math.abs(v*100).toFixed(1)}% vs prior`, good?u:!u]};
const card=(title,body,right='',cls='')=>`<div class="card ${cls}">${title?`<h3>${title}${right?`<span class="r">${right}</span>`:''}</h3>`:''}${body}</div>`;
const ph=(title,desc,actions='')=>`<div class="ph"><div><h1>${title}</h1>${desc?`<div class="desc">${desc}</div>`:''}</div><div class="act">${actions}</div></div>`;
const btn=(label,onclick,cls='',icon)=>`<button class="btn ${cls}" onclick="${onclick}">${icon?ic(icon,15):''}${label}</button>`;
const toggle=(on,onchange='')=>`<label class="tg"><input type="checkbox" ${on?'checked':''} onchange="${onchange}"><span></span></label>`;
const seg=(opts,cur,fn)=>`<div class="seg">${opts.map(o=>`<button class="${o===cur?'on':''}" onclick="${fn}('${o}')">${o}</button>`).join('')}</div>`;
const tabs=(opts,cur,fn)=>`<div class="tabs">${opts.map(o=>`<button class="${o===cur?'on':''}" onclick="${fn}('${o}')">${o}</button>`).join('')}</div>`;
const sel=(name,opts,cur,attrs='')=>`<select class="sel" name="${name}" ${attrs}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v==cur?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const fld=(label,inner,full)=>`<label class="f ${full?'full':''}">${label}${inner}</label>`;
const inp=(name,val='',type='text',attrs='')=>`<input class="inp" name="${name}" type="${type}" value="${esc(val)}" ${attrs}>`;
const hbars=(rows,fmt=num,color)=>{const mx=Math.max(...rows.map(r=>r.value),1);return rows.map(r=>`<div class="hb"><div class="lb" title="${esc(r.label)}">${esc(r.label)}</div><div class="tr"><i style="width:${(r.value/mx*100).toFixed(1)}%;${color||r.color?`background:${r.color||color}`:''}"></i></div><div class="vl">${fmt(r.value)}</div></div>`).join('')};
const insight=(t,m,icon='bulb',action='')=>`<div class="insight"><span class="ico">${ic(icon)}</span><div style="flex:1"><b>${t}</b><div class="m">${m}</div></div>${action}</div>`;
const avatar=(name,color)=>`<span class="av" style="background:${color||AVC[name.length%AVC.length]}">${esc(name.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`;

/* ===== Charts (SVG) ===== */
function axis(max,W,H,pl,pt,pb,fmt){let g='';for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E7EAF2"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(max*i/4)}</text>`}return g}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function _barChart(vals,labels,o={}){const W=o.W||640,H=o.h||200,pl=48,pt=8,pb=24,fmt=o.fmt||kfmt;const series=Array.isArray(vals[0])?vals:[vals];const max=niceMax(Math.max(...series.flat())*1.05);const n=labels.length,bw=(W-pl)/n,gw=bw*.68,sw=gw/series.length;let s=axis(max,W,H,pl,pt,pb,fmt);const step=Math.ceil(n/Math.max(2,Math.floor((W-pl)/54)));
series.forEach((ser,si)=>ser.forEach((v,i)=>{const h=(H-pt-pb)*v/max,x=pl+i*bw+(bw-gw)/2+si*sw,y=H-pb-h;s+=`<rect class="bar" x="${x}" y="${y}" width="${Math.max(sw-2,2)}" height="${Math.max(h,0)}" rx="3" fill="${(o.colors||[])[si]||PAL[si%PAL.length]}"><title>${labels[i]}: ${(o.tip||fmt)(v)}</title></rect>`}));
labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${l}</text>`});
return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${s}</svg>${o.legend?legend(o.legend,o.colors):''}`}
function _lineChart(series,labels,o={}){const W=o.W||640,H=o.h||210,pl=50,pt=8,pb=24,fmt=o.fmt||kfmt;const max=niceMax(Math.max(...series.flatMap(s=>s.vals))*1.05);const n=labels.length,dx=(W-pl-10)/(n-1||1);let s=axis(max,W,H,pl,pt,pb,fmt);const step=Math.ceil(n/Math.max(2,Math.floor((W-pl)/54)));
series.forEach((ser,si)=>{const c=ser.color||PAL[si%PAL.length];const pts=ser.vals.map((v,i)=>[pl+i*dx,H-pb-(H-pt-pb)*v/max]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
if(si===0&&!o.noArea)s+=`<path d="${d} L${pts[pts.length-1][0]} ${H-pb} L${pl} ${H-pb}Z" fill="${c}" opacity=".09"/>`;
s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.4" ${ser.dash?'stroke-dasharray="5 5"':''}/>`;
pts.forEach((p,i)=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"><title>${ser.name||''} ${labels[i]}: ${(o.tip||fmt)(ser.vals[i])}</title></circle>`)});
labels.forEach((l,i)=>{if(i%step===0)s+=`<text x="${pl+i*dx}" y="${H-6}" text-anchor="middle">${l}</text>`});
return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">${s}</svg>${series.length>1||o.legend?legend(series.map(s=>s.name),series.map((s,i)=>s.color||PAL[i%PAL.length])):''}`}
function donut(parts,o={}){const S=o.size||150,r=S/2-12,c=2*Math.PI*r,tot=sum(parts,p=>p.value)||1;let off=0,s='';parts.forEach((p,i)=>{const L=c*p.value/tot;s+=`<circle r="${r}" cx="${S/2}" cy="${S/2}" fill="none" stroke="${p.color||PAL[i%PAL.length]}" stroke-width="20" stroke-dasharray="${L} ${c-L}" stroke-dashoffset="${-off}" transform="rotate(-90 ${S/2} ${S/2})"><title>${p.label}: ${pct(p.value/tot)}</title></circle>`;off+=L});
return `<div class="flex" style="gap:16px;align-items:center;flex-wrap:wrap"><svg width="${S}" height="${S}" style="flex:none">${s}<text x="${S/2}" y="${S/2-2}" text-anchor="middle" font-size="18" font-weight="700" fill="#02025B">${o.center||''}</text><text x="${S/2}" y="${S/2+15}" text-anchor="middle" font-size="11" fill="#8A94A6">${o.sub||''}</text></svg><div class="dleg" style="flex:1;min-width:200px">${parts.map((p,i)=>`<div class="flex" style="margin:6px 0;font-size:13px"><i style="width:10px;height:10px;border-radius:3px;background:${p.color||PAL[i%PAL.length]};flex:none"></i><span style="flex:1;min-width:0;line-height:1.25">${esc(p.label)}</span><b style="min-width:40px;text-align:right">${pct(p.value/tot,0)}</b>${o.fmt?`<span class="muted sm" style="width:72px;text-align:right">${o.fmt(p.value)}</span>`:''}</div>`).join('')}</div></div>`}
const legend=(names,colors=[])=>`<div class="legend">${names.map((n,i)=>`<span><i style="background:${colors[i]||PAL[i%PAL.length]}"></i>${n}</span>`).join('')}</div>`;
function spark(vals,color='var(--accent)',w=90,h=26){const mx=Math.max(...vals),mn=Math.min(...vals),dx=w/(vals.length-1);const d=vals.map((v,i)=>(i?'L':'M')+(i*dx).toFixed(1)+' '+(h-2-(h-4)*(v-mn)/((mx-mn)||1)).toFixed(1)).join(' ');return `<svg width="${w}" height="${h}" style="vertical-align:middle"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`}

/* ===== Data tables ===== */
const TBL={};
function table(id,cols,rows,o={}){const prev=TBL[id];TBL[id]={cols,rows,o,q:prev?.q||'',sort:prev?.sort??null,dir:prev?.dir||1,page:0,ps:o.pageSize||10};
return `<div class="card flush">${o.title?`<h3>${o.title}${o.titleRight?`<span class="r">${o.titleRight}</span>`:''}</h3>`:''}${o.noTools?'':`<div class="tbl-tools">${o.noSearch?'':`<input class="inp" placeholder="Search ${o.noun||'records'}…" value="${esc(TBL[id].q)}" oninput="TBL['${id}'].q=this.value;TBL['${id}'].page=0;tblDraw('${id}')">`}${o.tools||''}<span class="sp"></span>${o.toolsRight||''}<button class="btn sm" onclick="tblCSV('${id}')">${ic('down',14)}Export CSV</button></div>`}<div id="tblb-${id}">${tblInner(id)}</div></div>`}
function tblRows(id){const t=TBL[id];let r=t.rows;if(t.o.filter)r=r.filter(t.o.filter);if(t.q){const q=t.q.toLowerCase();r=r.filter(x=>t.cols.some(c=>String(c.text?c.text(x):x[c.key]??'').toLowerCase().includes(q)))}
if(t.sort!=null){const c=t.cols[t.sort],f=c.sortv||(x=>c.text?c.text(x):x[c.key]);r=[...r].sort((a,b)=>{const A=f(a),B=f(b);return (typeof A==='number'&&typeof B==='number'?A-B:String(A).localeCompare(String(B)))*t.dir})}return r}
function tblInner(id){const t=TBL[id],all=tblRows(id),pages=Math.max(1,Math.ceil(all.length/t.ps));t.page=Math.min(t.page,pages-1);const rows=all.slice(t.page*t.ps,(t.page+1)*t.ps);
return `<div style="overflow:auto"><table class="dt"><thead><tr>${t.cols.map((c,i)=>`<th class="${c.n?'n':''}" onclick="tblSort('${id}',${i})">${c.label}${t.sort===i?(t.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr ${t.o.onRow?`style="cursor:pointer" onclick="${t.o.onRow(r)}"`:''}>${t.cols.map(c=>`<td data-l="${esc(c.label)}" class="${c.n?'n':''} ${c.cls||''} ${c.label?'':'nolbl'}"><span class="cv">${c.render?c.render(r):c.text&&c.key?esc(c.text(r)):esc(r[c.key])}</span></td>`).join('')}</tr>`).join(''):`<tr><td colspan="${t.cols.length}" class="empty">No matching records</td></tr>`}</tbody></table></div>
${all.length>t.ps?`<div class="tbl-foot"><span>${t.page*t.ps+1}–${Math.min((t.page+1)*t.ps,all.length)} of ${all.length}</span><span class="sp"></span><button class="btn sm" ${t.page?'':'disabled'} onclick="TBL['${id}'].page--;tblDraw('${id}')">‹ Prev</button><button class="btn sm" ${t.page<pages-1?'':'disabled'} onclick="TBL['${id}'].page++;tblDraw('${id}')">Next ›</button></div>`:`<div class="tbl-foot">${all.length} record${all.length===1?'':'s'}</div>`}`}
function tblDraw(id){const el=$('#tblb-'+id);if(el)el.innerHTML=tblInner(id)}
function tblSort(id,i){const t=TBL[id];if(t.sort===i)t.dir*=-1;else{t.sort=i;t.dir=t.cols[i].n?-1:1}tblDraw(id)}
function tblCSV(id){const t=TBL[id],rows=tblRows(id);const cols=t.cols.filter(c=>!c.noCsv);const lines=[cols.map(c=>c.label).join(',')].concat(rows.map(r=>cols.map(c=>{let v=c.csv?c.csv(r):c.text?c.text(r):r[c.key];v=String(v??'').replace(/"/g,'""');return /[",\n]/.test(v)?`"${v}"`:v}).join(',')));download((t.o.file||id)+'.csv',lines.join('\n'),'text/csv');toast(`Exported ${rows.length} rows to CSV`)}
function download(name,content,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),100)}

/* ===== Modals & toasts ===== */
let MODAL_OK=null;
function modal(title,body,o={}){MODAL_OK=o.onOk||null;$('#modalRoot').innerHTML=`<div class="overlay" onmousedown="if(event.target===this)closeModal()"><div class="modal ${o.wide?'wide':''}"><div class="mhd">${title}<button class="btn ghost sm" onclick="closeModal()">${ic('x',16)}</button></div><form class="mbd" id="mform" onsubmit="event.preventDefault();modalOk()">${body}</form>${o.noFooter?'':`<div class="mft">${o.extra||''}<button class="btn" onclick="closeModal()">${o.cancel||'Cancel'}</button>${o.ok===false?'':`<button class="btn pri" onclick="modalOk()">${o.ok||'Save'}</button>`}</div>`}</div></div>`;setTimeout(()=>{const f=$('#mform input:not([type=checkbox]),#mform select');f&&f.focus()},30)}
function modalOk(){const f=$('#mform');const data={};$$('[name]',f).forEach(e=>{data[e.name]=e.type==='checkbox'?e.checked:e.value});if(MODAL_OK&&MODAL_OK(data)===false)return;closeModal()}
function closeModal(){$('#modalRoot').innerHTML='';MODAL_OK=null}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i></i>${msg}`;const T=$('#toasts');T.appendChild(t);while(T.children.length>3)T.firstChild.remove();setTimeout(()=>t.remove(),3200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenus()}});
